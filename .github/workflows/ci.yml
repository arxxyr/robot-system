# CI 严格串行（`docs/10_verification.md` §10.2.3），全程 nightly。
#
# 矩阵：ubuntu-latest (x86_64) + macos-latest (arm64)。两平台都跑前 5 步，
# 因为 Step 0–5 的交付目标是 "macOS 可跑"（详 docs/00_design.md §11.3
# 构建假设 + docs/01_implementation_steps.md Step 5 macOS 烟测）。
# Step 6+ 的 Linux-only 工作（SCHED_FIFO / mlockall / sd_notify）用后续独立
# workflow 或 matrix 过滤，本文件不先配。
# robot-viz 的跨平台纯软件门独立运行；旧 test job 的根 Clippy 平台限制
# 仍保留，不让该既有问题阻止本轮观测桥检查。
#
# sccache：.cargo/config.toml 默认 rustc-wrapper = "sccache"，CI 必须装，
# 否则第一次 cargo 命令直接失败。用官方 action 注入。
#
# rust-toolchain.toml channel = "nightly"（未 pin 日期），actions-rust-lang
# 的 setup-rust-toolchain 会自动读该文件并 rustup install，不需显式传 toolchain。

name: ci

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0  # CI 关 incremental（与 sccache 组合时收益反转，且稳定缓存命中）
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"

jobs:
  version-tag:
    name: 校验版本标签
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.semver.outputs.valid }}
    steps:
      # tags 只支持 glob；完整 SemVer 在此校验，非法标签不启动构建与测试。
      - id: semver
        shell: bash
        run: |
          export LC_ALL=C
          number='(0|[1-9][0-9]*)'
          prerelease='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^v${number}\.${number}\.${number}(-${prerelease}(\.${prerelease})*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if [[ "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            echo '跳过：标签不符合 v 前缀的 SemVer 格式。'
          fi

  test:
    needs: version-tag
    if: needs.version-tag.outputs.valid == 'true'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # rust-toolchain.toml 里 channel = "nightly" + components = ["rustfmt", "clippy"]
          # 会被自动读取；这里 components 省略避免重复。
          cache: false  # 我们自管 sccache，不用 action 的 target cache。

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # 1. fmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

      # 2. clippy（pedantic 已在 workspace Cargo.toml 开 warn；`-D warnings` 升级成 error）
      - name: cargo clippy --all-targets --all-features -D warnings
        run: cargo clippy --all --all-targets --all-features -- -D warnings

      # 3. 全 feature 测试
      # W3 需要 release/abort S1；集成测试所需的同源 debug 二进制由 cargo test 生成。
      - name: 构建 W3 release S1 实件
        run: cargo build --locked --release -p robot-s1 --bin s1_daemon --all-features

      - name: cargo test --workspace --all-features
        env:
          B4_E2E_BIN_S0_DAEMON: ${{ github.workspace }}/target/debug/s0_daemon
          B4_E2E_BIN_S1_DAEMON: ${{ github.workspace }}/target/release/s1_daemon
          B4_E2E_BIN_ROBOT_RPC_GATEWAY: ${{ github.workspace }}/target/debug/robot_rpc_gateway
          ROBOT_W3_S1_UNWIND_BIN: ${{ github.workspace }}/target/debug/s1_daemon
        run: cargo test --locked --workspace --all-features

      # H2 最终 Disable 的真实 TCP/tonic 预算回归，显式执行以隔离默认单测。
      # 仅绑定本机随机端口；不启动 S0、不访问串口或现场硬件。
      - name: H2 final Disable transport regression
        timeout-minutes: 5
        run: >-
          cargo test --locked -p robot-tests --features comm-fault-rpc
          --test final_stop_transport -- --ignored --test-threads=1 --nocapture

      # 4. iceoryx2 feature off 的保底编译 + 测试（隔离保底，docs/01_implementation_steps.md
      #    Step 5 退出标准）
      - name: cargo test -p robot-transport --no-default-features --features mock
        run: cargo test -p robot-transport --no-default-features --features mock

      # 5. release 构建（产物可用于后续 soak / bench / 打包）
      - name: cargo build --release --workspace
        run: cargo build --release --workspace

      - name: sccache stats
        run: sccache --show-stats

  robot-viz:
    needs: version-tag
    if: needs.version-tag.outputs.valid == 'true'
    name: robot-viz software (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # 无 needs: test；旧根 job 的 Linux API 限制仍是独立未解决问题。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        # 显式 bash 保持 pipefail，tee 不掩盖 Cargo 的失败退出码。
        shell: bash
    env:
      ROBOT_VIZ_TEST_ARTIFACTS: ${{ github.workspace }}/target/robot-viz-ci
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Prepare robot-viz software evidence
        run: |
          mkdir -p "$ROBOT_VIZ_TEST_ARTIFACTS"
          git rev-parse HEAD > "$ROBOT_VIZ_TEST_ARTIFACTS/source_commit.txt"
          rustc --version --verbose > "$ROBOT_VIZ_TEST_ARTIFACTS/toolchain.txt"

      - name: cargo fmt --check
        run: cargo fmt --all --check 2>&1 | tee "$ROBOT_VIZ_TEST_ARTIFACTS/fmt.log"

      - name: cargo clippy robot-viz and robot-transport
        timeout-minutes: 20
        run: |
          cargo clippy --locked -p robot-viz -p robot-transport --all-targets \
            -- -D warnings 2>&1 | tee "$ROBOT_VIZ_TEST_ARTIFACTS/clippy.log"

      - name: robot-viz library tests
        timeout-minutes: 20
        run: |
          cargo test --locked -p robot-viz --lib \
            2>&1 | tee "$ROBOT_VIZ_TEST_ARTIFACTS/lib_tests.log"

      # 六项 ignored 场景显式串行执行，只使用测试 topic / loopback。
      # 覆盖真实 SHM → Rerun 文件、拒绝路径、进程退出与短命 topic 回收。
      - name: robot-viz observer roundtrip
        timeout-minutes: 10
        run: |
          cargo test --locked -p robot-viz --test observer_roundtrip \
            -- --ignored --test-threads=1 --nocapture \
            2>&1 | tee "$ROBOT_VIZ_TEST_ARTIFACTS/roundtrip.log"

      # 观测工具使用 unwind profile；不改变原 S0 / S1 release 构建门。
      - name: cargo build robot-viz release-tools
        timeout-minutes: 25
        run: |
          cargo build --locked --profile release-tools -p robot-viz \
            2>&1 | tee "$ROBOT_VIZ_TEST_ARTIFACTS/release_tools.log"

      - name: Upload robot-viz software evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: robot-viz-${{ matrix.os }}
          path: target/robot-viz-ci/
          if-no-files-found: warn

      - name: sccache stats
        if: ${{ always() }}
        run: sccache --show-stats

  matrix-build:
    name: matrix build (${{ matrix.combo }})
    runs-on: ubuntu-latest
    needs: test
    # Step 7 task 27b：验证 robot-s0 binary 在每个 robot-specific feature combo
    # 下都能编译 + 跑 1s smoke。test job 已经覆盖 default features = `xlerobot`，
    # 这里增量验证 mock-only / atom01；新机器人加 entry 时往 matrix 加一行即可。
    strategy:
      fail-fast: false
      matrix:
        combo: [mock-only, xlerobot, atom01]
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: cargo build -p robot-s0 --no-default-features --features ${{ matrix.combo }}
        run: |
          cargo build --release \
            -p robot-s0 --bin s0_daemon \
            --no-default-features --features ${{ matrix.combo }}

      - name: cargo test -p robot-s0 --no-default-features --features ${{ matrix.combo }}
        run: |
          cargo test --release \
            -p robot-s0 \
            --no-default-features --features ${{ matrix.combo }}

  baseline-smoke:
    name: iceoryx2 baseline smoke (30s, ubuntu)
    runs-on: ubuntu-latest
    needs: test
    # 仅作 *harness 不退化* 冒烟：宽阈值（p99 50 ms / p999 100 ms）+ 不带
    # `--strict-rt`，GitHub 共享 runner 拿不到 SCHED_FIFO，会自动降级到
    # 普通线程优先级。这一关只验证：
    #   (1) iceoryx2 service open / sample 路径仍工作；
    #   (2) sample_ratio ≥ 90%（harness 内部已硬编码失败条件之一）；
    #   (3) `iceoryx2_rt_baseline` bin 没被改坏。
    # XLeRobot 不卡 `docs/00_design.md` §10.1 的 100 µs / 500 µs 硬门槛
    # （Orin Nano 算力 + 非 PREEMPT_RT 内核做不到也不需要，详见
    #  `docs/CHANGELOG.md` 2026-04-24 "Step 6.5 RT 调优搁置 + XLeRobot 不卡硬门槛"）。
    # 真要拿 Orin 数据走 `scripts/baseline.sh orin`，本地手动跑。
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build iceoryx2_rt_baseline (release)
        run: cargo build -p robot-tests --release --bin iceoryx2_rt_baseline

      - name: Run smoke (30s, p99 ≤ 50 ms, p999 ≤ 100 ms)
        run: |
          ./target/release/iceoryx2_rt_baseline \
            --duration 30s \
            --hz 50 \
            --p99-us 50000 \
            --p999-us 100000

  deny:
    needs: version-tag
    if: needs.version-tag.outputs.valid == 'true'
    name: cargo deny
    runs-on: ubuntu-latest
    # `.cargo/config.toml` 把 rustc-wrapper 设为 sccache，但本 job 不装
    # sccache（deny 只跑 `cargo metadata` 读依赖树，不需要编译缓存）。
    # 用 CARGO_BUILD_RUSTC_WRAPPER="" 覆盖 config.toml，避免 cargo 找不到
    # sccache 失败。cargo 文档：`CARGO_BUILD_RUSTC_WRAPPER` 覆盖
    # `[build].rustc-wrapper`，空串即 "不使用 wrapper"。
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (for cargo metadata)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install cargo-deny (binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

# TODO（与 docs/10_verification.md §10.2.3 CI 顺序 6–9 对齐，后续 Step 加）：
# - allocation-guard：Step 6 `assert-no-alloc` + `rt_arc_guard` 钩子就位后加
#   （task 26 落地后挂 nightly schedule 跑 `cargo test --features rt_guard -- --ignored`）
# - schema_compat：Step 2 已有运行时交叉测试在 `cargo test` 里；跨 crate 版本
#   交叉推到 v0.3（CHANGELOG 2026-04-22 Step 2 工具链决策）
# - soak 1h / 24h：Step 9 `robot-tests::soak` bin 就位后加 nightly schedule
