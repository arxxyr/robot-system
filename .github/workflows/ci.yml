# CI 严格串行（`docs/10_verification.md` §10.2.3），全程 nightly。
#
# 矩阵：ubuntu-latest (x86_64) + macos-latest (arm64)。两平台都跑前 5 步，
# 因为 Step 0–5 的交付目标是 "macOS 可跑"（详 docs/00_design.md §11.3
# 构建假设 + docs/01_implementation_steps.md Step 5 macOS 烟测）。
# Step 6+ 的 Linux-only 工作（SCHED_FIFO / mlockall / sd_notify）用后续独立
# workflow 或 matrix 过滤，本文件不先配。
#
# sccache：.cargo/config.toml 默认 rustc-wrapper = "sccache"，CI 必须装，
# 否则第一次 cargo 命令直接失败。用官方 action 注入。
#
# rust-toolchain.toml channel = "nightly"（未 pin 日期），actions-rust-lang
# 的 setup-rust-toolchain 会自动读该文件并 rustup install，不需显式传 toolchain。

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0  # CI 关 incremental（与 sccache 组合时收益反转，且稳定缓存命中）
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # rust-toolchain.toml 里 channel = "nightly" + components = ["rustfmt", "clippy"]
          # 会被自动读取；这里 components 省略避免重复。
          cache: false  # 我们自管 sccache，不用 action 的 target cache。

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # 1. fmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

      # 2. clippy（pedantic 已在 workspace Cargo.toml 开 warn；`-D warnings` 升级成 error）
      - name: cargo clippy --all-targets --all-features -D warnings
        run: cargo clippy --all --all-targets --all-features -- -D warnings

      # 3. 全 feature 测试
      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features

      # 4. iceoryx2 feature off 的保底编译 + 测试（隔离保底，docs/01_implementation_steps.md
      #    Step 5 退出标准）
      - name: cargo test -p robot-transport --no-default-features --features mock
        run: cargo test -p robot-transport --no-default-features --features mock

      # 5. release 构建（产物可用于后续 soak / bench / 打包）
      - name: cargo build --release --workspace
        run: cargo build --release --workspace

      - name: sccache stats
        run: sccache --show-stats

  matrix-build:
    name: matrix build (${{ matrix.combo }})
    runs-on: ubuntu-latest
    needs: test
    # Step 7 task 27b：验证 robot-s0 binary 在每个 robot-specific feature combo
    # 下都能编译 + 跑 1s smoke。test job 已经覆盖 default features = `xlerobot`，
    # 这里增量验证 mock-only / atom01；新机器人加 entry 时往 matrix 加一行即可。
    strategy:
      fail-fast: false
      matrix:
        combo: [mock-only, xlerobot, atom01]
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: cargo build -p robot-s0 --no-default-features --features ${{ matrix.combo }}
        run: |
          cargo build --release \
            -p robot-s0 --bin s0_daemon \
            --no-default-features --features ${{ matrix.combo }}

      - name: cargo test -p robot-s0 --no-default-features --features ${{ matrix.combo }}
        run: |
          cargo test --release \
            -p robot-s0 \
            --no-default-features --features ${{ matrix.combo }}

  baseline-smoke:
    name: iceoryx2 baseline smoke (30s, ubuntu)
    runs-on: ubuntu-latest
    needs: test
    # 仅作 *harness 不退化* 冒烟：宽阈值（p99 50 ms / p999 100 ms）+ 不带
    # `--strict-rt`，GitHub 共享 runner 拿不到 SCHED_FIFO，会自动降级到
    # 普通线程优先级。这一关只验证：
    #   (1) iceoryx2 service open / sample 路径仍工作；
    #   (2) sample_ratio ≥ 90%（harness 内部已硬编码失败条件之一）；
    #   (3) `iceoryx2_rt_baseline` bin 没被改坏。
    # XLeRobot 不卡 `docs/00_design.md` §10.1 的 100 µs / 500 µs 硬门槛
    # （Orin Nano 算力 + 非 PREEMPT_RT 内核做不到也不需要，详见
    #  `docs/CHANGELOG.md` 2026-04-24 "Step 6.5 RT 调优搁置 + XLeRobot 不卡硬门槛"）。
    # 真要拿 Orin 数据走 `scripts/baseline.sh orin`，本地手动跑。
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build iceoryx2_rt_baseline (release)
        run: cargo build -p robot-tests --release --bin iceoryx2_rt_baseline

      - name: Run smoke (30s, p99 ≤ 50 ms, p999 ≤ 100 ms)
        run: |
          ./target/release/iceoryx2_rt_baseline \
            --duration 30s \
            --hz 50 \
            --p99-us 50000 \
            --p999-us 100000

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    # `.cargo/config.toml` 把 rustc-wrapper 设为 sccache，但本 job 不装
    # sccache（deny 只跑 `cargo metadata` 读依赖树，不需要编译缓存）。
    # 用 CARGO_BUILD_RUSTC_WRAPPER="" 覆盖 config.toml，避免 cargo 找不到
    # sccache 失败。cargo 文档：`CARGO_BUILD_RUSTC_WRAPPER` 覆盖
    # `[build].rustc-wrapper`，空串即 "不使用 wrapper"。
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (for cargo metadata)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install cargo-deny (binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

