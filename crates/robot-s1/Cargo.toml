[package]
name         = "robot-s1"
description  = "S1（快反射层）：v0.3 起 coordinator lib 层 + s1_daemon production binary；mock_s1 保留作 ballet 工具。"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

# v0.3 B2 (2/3) feature wiring：每个 backend 一个 feature；profile.backends
# = [...] 只能选 enabled feature 编进 binary 的 backend 名。Default 把
# `backend-mock-dwell` 打开 = B1 no-active-action 路径默认配置（reviewer 拍
# 板：缺失 [s1.profile] 时 backends = ["mock_dwell"]，需要 mock_dwell 真
# link 进 binary）。B3 起加 backend-ik-xlerobot / backend-rl-onnx /
# backend-scripted；落地对应 backend crate 时同步加 feature flag。
[features]
default            = ["backend-mock-dwell", "backend-hold-pose"]
backend-mock-dwell = []
# v0.3 B3 (1/2)：HoldPoseBackend 第一个真 action backend（详
# docs/handoffs/v0.3_b3_outline.md round 2）。Feature off 时整文件
# 不 link → BackendRegistry::from_inventory 收集不到 hold_pose →
# `[s1.profile.backends = ["hold_pose"]]` 启动期 fail-fast，符合
# "配置与编译 profile 不匹配启动期 fail-fast"硬约束。
backend-hold-pose  = []

# v0.3 B1 (2/3)：mock_s1 / s1_daemon 显式列出 [[bin]]。
# - mock_s1：v0.2 起 ballet / bench / 真机摆动测试工具（保留；非 production
#   S1，详 docs/handoffs/v0.3_b1_outline.md §6.2）。
# - s1_daemon：v0.3 B1 production S1 binary（hold + heartbeat 最小闭环 +
#   启动锚定 fail-fast）。
[[bin]]
name = "mock_s1"
path = "src/bin/mock_s1.rs"

[[bin]]
name = "s1_daemon"
path = "src/bin/s1_daemon.rs"

[dependencies]
robot-core      = { workspace = true }
robot-logging   = { workspace = true }
robot-msg       = { workspace = true }
robot-transport = { workspace = true }
iceoryx2        = { workspace = true }
# Linux 信号处理（SIGINT/SIGTERM → 原子 AtomicBool）；只 Linux 走实现，其他 OS 桩空。
libc            = { workspace = true }
# task-32 (2026-04-25)：日志骨架统一到 tracing。
tracing         = { workspace = true }
# v0.3 B1 (1/3) coordinator lib 层依赖：
# - serde + toml：[s1] section 自反序列化（CoordinatorConfig）。
#   不复用 robot-s0::config_loader，避免 s1 → s0 层级反向依赖（B1 outline §3
#   reviewer 拍板硬边界）。
# - thiserror：ConfigError / AnchorError 枚举的 Display + From derive。
# - flatbuffers：parse_anchor_from_state_bytes 直接 root::<JointState> 解码
#   订阅来的 sample bytes（非 RT 启动期路径，allocator 安全）。
serde           = { workspace = true, features = ["derive"] }
toml            = { workspace = true }
thiserror       = { workspace = true }
flatbuffers     = { workspace = true }
# v0.3 B2 (1/3) action interface lib 层依赖：
# - uuid：ActionId UUIDv7 生成 + 显示（B2 outline §10 决策 #2 拍板，
#   跟 RPC CommandMeta.request_id 同款时间排序）。workspace 已有 v7 + std
#   feature，跟 robot-rpc 共享同一份依赖。
uuid            = { workspace = true }
# v0.3 B2 (2/3) backend registry 静态注册（与 robot-core::factory adapter
# 注册同款）。inventory 把链接进 binary 的每个 `submit!` 项收到一个 array
# section，BackendRegistry::from_inventory 启动期一次性扫描，无 alloc 无
# IO。白名单沿用 workspace 顶层登记（已记 docs/CHANGELOG.md 2026-04-24
# "Step 7 task 27b matrix + inventory adapter 自注册"）。
inventory       = { workspace = true }

[lints]
workspace = true
