[package]
name         = "robot-s1"
description  = "S1（快反射层）：v0.3 起 coordinator lib 层 + robot-s1 production binary；mock_s1 保留作 ballet 工具。"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

# v0.3 B2 (2/3) feature wiring：每个 backend 一个 feature；profile.backends
# = [...] 只能选 enabled feature 编进 binary 的 backend 名。Default 把
# `backend-mock-dwell` 打开 = B1 no-active-action 路径默认配置（reviewer 拍
# 板：缺失 [s1.profile] 时 backends = ["mock_dwell"]，需要 mock_dwell 真
# link 进 binary）。B3 起加 backend-ik-xlerobot / backend-rl-onnx /
# backend-scripted；落地对应 backend crate 时同步加 feature flag。
[features]
default            = ["backend-mock-dwell", "backend-hold-pose", "backend-scripted", "backend-ik"]
backend-mock-dwell = []
# HoldPoseBackend。Feature off 时整文件
# 不 link → BackendRegistry::from_inventory 收集不到 hold_pose →
# `[s1.profile.backends = ["hold_pose"]]` 启动期 fail-fast，符合
# "配置与编译 profile 不匹配启动期 fail-fast"硬约束。
backend-hold-pose  = []
# ScriptedBackend（joint-space 线性插值 + waypoint dwell）。
# Q17(a) 拍板：进 default features，沿 hold_pose / mock_dwell 同款策略
# （避免 smoke binary / 文档维护额外 feature flag）。Feature off 时整
# 文件不 link → BackendRegistry::from_inventory 收集不到 scripted →
# `[s1.profile.backends = ["scripted"]]` 启动期 fail-fast，符合
# "配置与编译 profile 不匹配启动期 fail-fast"硬约束。
backend-scripted   = []
# IkBackend（笛卡尔 pose IK 解算 + 关节位置一次性输出），进 default features，
# 沿 hold_pose / mock_dwell / scripted 同款策略。Feature off 时整文
# 件不 link → BackendRegistry::from_inventory 收集不到 ik →
# `[s1.profile.backends = ["ik"]]` 启动期 fail-fast (validate_
# profile_section UnknownBackend；Q-IK10 (a-i))，符合"配置与编译
# profile 不匹配启动期 fail-fast"硬约束。
#
# **双 workspace dep**（Q-IK1 ACK）：feature on 时把 `robot-kinematics`
# (trait crate) + `robot-kinematics-xlerobot` (impl crate) 一起拉进
# binary；不允许只 link trait 而漏 impl（会导致 robot-s1 编不出 solver
# 注入路径）。
# **dep policy**：`robot-kinematics`（trait crate）**永远**链接（零 runtime
# 依赖，仅 `ArmIkSolver` trait + POD 共享类型；让 `ActionContext::solver` /
# `Coordinator::solver` 字段不必 cfg gate）；只 `robot-kinematics-xlerobot`
# （impl crate）由本 feature optional gate（XLeRobotArmIkSolver 实例化
# 只在 robot-s1 binary，按 backend-ik feature 走 cfg 路径）。
backend-ik         = ["dep:robot-kinematics-xlerobot"]
# v0.5 候选 E 段(8)（Spec P.2.7 R5-5/R6-5）：test-only freeze hook——cfg 守门
# `liveness::freeze_check` + `freeze_control`（`/<robot_id>/s1/test/freeze`
# 注入线程 + `TestFreezeCommandV2` / `WorkerKind` pub 导出给 sd_watchdog_smoke
# import）。**永不进 default features / 生产 release**（沿 S0 `test-freeze-hook`
# 单数命名与硬边界）。
test-freeze-hook   = []
# v0.5 候选 E 段(7)（Spec QA6 + R3-B1）：test-only `FaultInjectBackend`
# （`fault_inject`；分发键 = DwellMs + NO_PAYLOAD_SCHEMA_ID，0 新 wire；
# 3 tick 后 `ActionFailure::InternalError("fault_inject")`）——生产 backend
# 无执行期 failure 触发器（Scripted 运行期只 Continue/Completed，IK 错误全在
# start 阶段），AC-E14 执行期不对称终态 / AC-E18 failure 分支靠它驱动。
# **永不进 default features**；e2e 前显式 `cargo build --release -p robot-s1
# --bin robot-s1 --features test-fault-backend`（P.0 活清单）。
# **profile 冲突消除**：启用它的 config 必须从 `[s1.profile] backends` 移除
# `mock_dwell`（分发键重合，dispatch 取首个命中）。
test-fault-backend = []
# 仅软件模拟：复用原 InvokeTask 与混合 JointCommand，不进入默认或发布构建。
test-base-command = ["backend-scripted"]

# v0.3 B1 (2/3)：mock_s1 / robot-s1 显式列出 [[bin]]。
# - mock_s1：v0.2 起 ballet / bench / 真机摆动测试工具（保留；非 production
#   S1）。
# - robot-s1：v0.3 B1 production S1 binary（hold + heartbeat 最小闭环 +
#   启动锚定 fail-fast）。
[[bin]]
name = "mock_s1"
path = "src/bin/mock_s1.rs"

[[bin]]
name = "robot-s1"
path = "src/bin/robot-s1.rs"

[dependencies]
robot-core      = { workspace = true }
# 仅复用校准原位范围的纯换算，不启用 real-hw。
robot-adapter-feetech = { workspace = true }
robot-logging   = { workspace = true }
robot-msg       = { workspace = true }
robot-transport = { workspace = true }
iceoryx2        = { workspace = true }
# Linux 信号处理（SIGINT/SIGTERM → 原子 AtomicBool）；只 Linux 走实现，其他 OS 桩空。
libc            = { workspace = true }
# task-32 (2026-04-25)：日志骨架统一到 tracing。
tracing         = { workspace = true }
# v0.3 B1 (1/3) coordinator lib 层依赖：
# - serde + toml：[s1] section 自反序列化（CoordinatorConfig）。
#   不复用 robot-s0::config_loader，避免 s1 → s0 层级反向依赖（B1 outline §3
#   reviewer 拍板硬边界）。
# - thiserror：ConfigError / AnchorError 枚举的 Display + From derive。
# - flatbuffers：parse_anchor_from_state_bytes 直接 root::<JointState> 解码
#   订阅来的 sample bytes（非 RT 启动期路径，allocator 安全）。
serde           = { workspace = true, features = ["derive"] }
toml            = { workspace = true }
thiserror       = { workspace = true }
flatbuffers     = { workspace = true }
# v0.3 B2 (1/3) action interface lib 层依赖：
# - uuid：ActionId UUIDv7 生成 + 显示（B2 outline §10 决策 #2 拍板，
#   跟 RPC CommandMeta.request_id 同款时间排序）。workspace 已有 v7 + std
#   feature，跟 robot-rpc 共享同一份依赖。
uuid            = { workspace = true }
# v0.3 B2 (2/3) backend registry 静态注册（与 robot-core::factory adapter
# 注册同款）。inventory 把链接进 binary 的每个 `submit!` 项收到一个 array
# section，BackendRegistry::from_inventory 启动期一次性扫描，无 alloc 无
# IO。白名单沿用 workspace 顶层登记（已记 docs/CHANGELOG.md 2026-04-24
# "Step 7 task 27b matrix + inventory adapter 自注册"）。
inventory       = { workspace = true }
# v0.4 候选 2 round 2 (3/4) IkBackend 依赖（Q-IK1 ACK 双 workspace
# dep；optional 由 backend-ik feature 启用 dep:robot-kinematics +
# dep:robot-kinematics-xlerobot）：
# - robot-kinematics：trait crate（ArmIkSolver trait + Pose / IkSolution /
#   IkError 共享类型）；Coordinator 持 Option<Box<dyn ArmIkSolver>>，
#   ActionContext 透传 Option<&dyn ArmIkSolver>。
# - robot-kinematics-xlerobot：XLeRobotArmIkSolver impl（5-DOF 闭式
#   IK；robot-s1 binary 启动期按 backend-ik feature 创建实例注入
#   Coordinator）。
robot-kinematics          = { workspace = true }
robot-kinematics-xlerobot = { workspace = true, optional = true }
# v0.5 候选 E 段(8)（Spec PD-E6(c) + D12）：sd_notify + liveness-gated watchdog
# 单一实现（自 robot-s0 迁入 robot-health；工作区内部依赖边，0 新外部 crate）。
robot-health              = { workspace = true }

[lints]
workspace = true
