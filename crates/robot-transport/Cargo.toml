[package]
name        = "robot-transport"
description = "本机通信层：iceoryx2 封装 + FrameHeader/Body/Blob parser + SampleLease<T>。"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

[dependencies]
# Step 3/4 白名单登记见 docs/CHANGELOG.md 2026-04-22 "workspace runtime 依赖白名单机制"。
# Step 5 加 iceoryx2 登记见 CHANGELOG 同日 "Step 5 开工决策与 iceoryx2 依赖登记"。
robot-core  = { workspace = true }
robot-msg   = { workspace = true }
flatbuffers = { workspace = true }
thiserror   = { workspace = true }
iceoryx2    = { workspace = true, optional = true }
# Step 6 Part 1：LatestCommandSlot 的同步原语（ipc_thread → rt_thread 方向）。
# Guard 基于 hazard pointer，不 bump refcount → RT 侧 load() 不触 Arc ops。
arc-swap    = { workspace = true }

[features]
# 默认同时启用 mock（保底 / trybuild 负向测试）和 iceoryx2（真后端）。
# iceoryx2 feature off 时（`--no-default-features --features mock`）仍可编译 +
# 跑 mock 测试，作为后端隔离保底（docs/01_implementation_steps.md Step 5 退出标准）。
default = ["mock", "iceoryx2"]
mock = []
iceoryx2 = ["dep:iceoryx2"]

[dev-dependencies]
# 编译期负向测试：验证 `SampleLease::view()` 借用 / `SampleWriter::publish(self)`
# move 语义在误用时产生 compile error。nightly 诊断格式变动可能要求
# `TRYBUILD=overwrite` 刷一次 snapshot，见 tests/trybuild.rs 注释。
trybuild = "1.0.116"

[lints]
workspace = true
