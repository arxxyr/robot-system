[package]
name         = "robot-s0"
description  = "S0 二进制：四线程骨架 + 状态机 + mock adapter 接入（v0.2 Step 6 Part 1）。"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

[dependencies]
robot-core          = { workspace = true }
robot-transport     = { workspace = true }
robot-msg           = { workspace = true }
robot-adapter-mock  = { workspace = true }
# watchdog / ipc_thread 非 RT 事件队列（Part 2）。
crossbeam-channel   = { workspace = true }
# s0_daemon bin 构造 iceoryx2 Node / subscriber / publisher（lib 层只抽象 Subscriber/Publisher 类型）。
iceoryx2            = { workspace = true }
# s0_daemon bin 信号处理（SIGINT / SIGTERM）直接用 libc 的 signal FFI。
libc                = { workspace = true }
# Step 7 task 25：config TOML loader（仅 s0_daemon / config_loader 用）。
# robot-core 不引入 serde/toml，恪守 §4.2 零 runtime 依赖；白名单登记见
# docs/CHANGELOG.md 2026-04-24 "Step 7 task 25 robot-s0 / robot-core::config 依赖白名单更新"。
serde               = { workspace = true }
toml                = { workspace = true }
# blake3：算 ConfigIdentity.config_hash（v0.2 仅这一字段，余 4 hash placeholder）。
blake3              = { workspace = true }
# thiserror：config_loader::ConfigLoadError 派生 Display/Error。robot-core 已用，
# 走 workspace 继承避免版本漂移。
thiserror           = { workspace = true }

[dev-dependencies]
# estop_latch 单测用 tempfile 做临时目录。版本 pin 在 workspace Cargo.toml。
tempfile = { workspace = true }

[features]
default = []
# 对齐 robot-core::rt_guard feature；binary 侧需要自己声明 AllocDisabler
# 作为 global_allocator 才能让 assert_no_alloc 生效（见 src/bin/s0_daemon.rs）。
rt_guard = ["robot-core/rt_guard", "dep:assert_no_alloc"]

[dependencies.assert_no_alloc]
version  = "1.1"
optional = true

[lints]
workspace = true
