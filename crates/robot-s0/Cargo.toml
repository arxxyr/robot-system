[package]
name         = "robot-s0"
description  = "S0 二进制：四线程骨架 + 状态机 + mock adapter 接入（v0.2 Step 6 Part 1）。"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

[dependencies]
robot-core          = { workspace = true }
robot-health        = { workspace = true }
robot-logging       = { workspace = true }
robot-transport     = { workspace = true }
robot-msg           = { workspace = true }
# task-32 (2026-04-25) 日志骨架：tracing macro 在 bin / lib 全用，subscriber
# init 只在 bin main 做一次（走 robot-logging::init()）。
tracing             = { workspace = true }
# adapter crates 全部 optional，由 robot 组合 features 决定 link 哪些。
# 每加一个新 adapter，按 mock / feetech 同模式扩 [features] 段。
robot-adapter-mock    = { workspace = true, optional = true }
robot-adapter-feetech = { workspace = true, optional = true }
# watchdog / ipc_thread 非 RT 事件队列（Part 2）。
crossbeam-channel   = { workspace = true }
# s0_daemon bin 构造 iceoryx2 Node / subscriber / publisher（lib 层只抽象 Subscriber/Publisher 类型）。
iceoryx2            = { workspace = true }
# s0_daemon bin 信号处理（SIGINT / SIGTERM）直接用 libc 的 signal FFI。
libc                = { workspace = true }
# Step 7 task 25：config TOML loader（仅 s0_daemon / config_loader 用）。
# robot-core 不引入 serde/toml，恪守 §4.2 零 runtime 依赖；白名单登记见
# docs/CHANGELOG.md 2026-04-24 "Step 7 task 25 robot-s0 / robot-core::config 依赖白名单更新"。
serde               = { workspace = true }
toml                = { workspace = true }
# blake3：算 ConfigIdentity.config_hash（v0.2 仅这一字段，余 4 hash placeholder）。
blake3              = { workspace = true }
# thiserror：config_loader::ConfigLoadError 派生 Display/Error。robot-core 已用，
# 走 workspace 继承避免版本漂移。
thiserror           = { workspace = true }
# rr_server_thread (A1-3 (1/3c-1)) decode wire ClearEStopRequest payload；
# 跟 robot-msg 的 build_helpers 同源（依赖白名单同 robot-msg 一致）。
flatbuffers         = { workspace = true }

# 段(9) 部署件 CLI：真串口读写要 serialport / libudev，故 required-features
# 锁死在 xlerobot-real——dev / CI 默认 build 不拉这条系统依赖。
# （s0_daemon 仍走 src/bin/ 自动发现，显式列一个 bin 不影响其余自动发现。）
[[bin]]
name              = "xlerobot_deploy"
path              = "src/bin/xlerobot_deploy.rs"
required-features = ["xlerobot-real"]

[dev-dependencies]
# estop_latch 单测用 tempfile 做临时目录。版本 pin 在 workspace Cargo.toml。
tempfile = { workspace = true }

[features]
# default = xlerobot：开发期 cargo test / cargo run 默认拿到 mock + feetech。
# CI matrix 显式覆盖：mock-only / xlerobot / atom01（详 .github/workflows/ci.yml）。
default = ["xlerobot"]

# ── adapter 组合 features（matrix 入口；新 robot 在此扩 entry）──
mock-only = ["mock"]
xlerobot  = ["mock", "feetech"]
atom01    = ["mock"] # v0.5 piper crate 落地后改 ["mock", "piper"]

# ── 真硬件组合（Step 7 task 28）——
# `xlerobot-real`：在 xlerobot 基础上启 feetech 的 real-hw（拉 serialport），
# Orin / Linux 真机部署用。dev / CI 默认 xlerobot 仅 mock，避免 libudev-dev
# 系统依赖。
xlerobot-real = ["xlerobot", "robot-adapter-feetech/real-hw"]

# ── adapter 基础 features（gating 单 crate dep；不直接给用户用，用上面组合 ──
mock    = ["dep:robot-adapter-mock"]
feetech = ["dep:robot-adapter-feetech"]

# 对齐 robot-core::rt_guard feature；binary 侧需要自己声明 AllocDisabler
# 作为 global_allocator 才能让 assert_no_alloc 生效（见 src/bin/s0_daemon.rs）。
rt_guard = ["robot-core/rt_guard", "dep:assert_no_alloc"]

# ── A2 freeze hook（test-only；闭 §6.7 #2 systemd watchdog e2e）──
#
# v0.3 A2 实施。**生产 release 不得带本 feature**：
# - **不得**进 default / xlerobot / xlerobot-real / atom01 / mock-only / rt_guard。
# - 仅用于 dev `cargo test`（cfg(test) 自动激活）+ A2-3 落地后的
#   `crates/robot-tests::freeze_systemd_smoke`（编译时显式 `--features
#   robot-s0/test-freeze-hook`）+ Orin 1 round 兼容性回归。
# - reviewer 硬边界（v0.3 entry handoff §4.2 + 拍板）：本 feature 进生产
#   build 视为阻断；v0.3 期间任何 release 二进制 / production combo 都禁
#   link 本 feature。详 `crates/robot-s0/src/freeze_hook.rs` 模块 doc。
test-freeze-hook = []
# 通信故障验收专用；与 freeze 开关独立，所有生产组合均不启用。
test-comm-fault-hook = []

[dependencies.assert_no_alloc]
workspace = true
optional  = true

[lints]
workspace = true

[[test]]
name = "comm_fault_startup"
required-features = ["test-comm-fault-hook"]
