// v0.3 A1 ClearEStop + v0.3 B4 task control plane proto schema。
//
// 对应 docs/00_design.md §5.2 (CommandMeta + AuthContext) + §5.3 frozen
// RPC schema。**字段 / 字段编号不可改**；只可 append。
//
// **当前 scope**（v0.5 候选 B land 后）：8 条 RPC =
//   - `ClearEStop`           (A1 land；safety-critical maintainer-only)
//   - `InvokeTask`           (B4)
//   - `CancelTask`           (B4)
//   - `GetTaskStatus`        (B4)
//   - `StreamTaskEvents`     (B4 server-streaming via per-ActionId pubsub)
//   - `ClearError`           (B4)
//   - `GetState`             (v0.5 候选 B；只读 state 快照，additive)
//   - `StreamState`          (v0.5 候选 B；只读 state server-streaming，additive)
//
// **v0.5 候选 B GetState/StreamState 设计-freeze diff**：design §5.3 写
// `rpc GetState (Empty)`，实现期按多 hardware 语义改 `GetState(GetStateRequest
// { hardware_id })`（显式 hardware selector）；design.md §5.3 文字**不**改，以
// docs/CHANGELOG.md + team-swe Spec v0_5_get_stream_state 为准。
//
// 其它 §5.3 RPC（SetEnabled / EStop / ListHardware / ListJoints /
// ListTasks / StreamLogs / ReloadCalibration / SetPolicy）留 v0.5+ 后续
// 拍板，**不**在本 proto 出现。
//
// **跟 robot-msg 关系**：本 proto 是 RPC 边界 wire format（client →
// gateway, HTTP/2）；gateway 内部转换为 `robot-msg` 平行 fbs 表
// （`clear_estop.fbs` / `action_request.fbs` / `action_status.fbs` /
// `action_event.fbs`）发到 daemon（iceoryx2 zero-copy）。两份 schema
// 平行存在；**不**等价 / **不**自动转换。详
// docs/handoffs/v0.3_b4_outline.md §6.1 双层 schema 分工。

syntax = "proto3";

package robot.control.v1;

// 调用方身份。docs/00_design.md §5.2 frozen。
//
// v0.3 A1 接受 fake token（gateway 端用查表把 token → role）；mTLS / OIDC
// 留 v0.5+。
message AuthContext {
    string token            = 1;  // fake token，对照 configs/rpc_roles.toml
    string mtls_fingerprint = 2;  // v0.5+ 用；A1-1 仅占位
}

// docs/00_design.md §5.2 frozen envelope。每条 RPC 必带。
//
// 字段语义（与 docs/CHANGELOG.md 2026-04-26 ClearEStop control action 解释
// 登记一致）：
// - request_id：UUIDv7，gateway 生成或客户端传；用 RR correlation + audit
//   trace。`auth.rs::validate_request_id` 拒绝非 UUIDv7 / 空串。
// - source：调用源 ("cli.loosqk" / "web.ui" / "local_panel.s0")。仅 audit。
// - auth：见 AuthContext。
// - timeout_ms：客户端 monotonic 相对超时；gateway 转 daemon clock
//   `deadline_ns = clock.now() + timeout_ms * 1_000_000`。
// - idempotency_key：robot-rpc 进程内 TTL cache key。同 key 不同 payload
//   必须拒绝（reviewer A1 第 3 个拍板）。`request_id` **不**等于
//   `idempotency_key`：前者每次重试改变（用于 audit），后者跨重试稳定。
// - dry_run：daemon 端 action layer **必须**真识别（reviewer A1 第 2 个
//   拍板：dry_run 进 S0 端 action layer，gateway 不短路）。
// - audit_reason：human context "谁/为什么调"。
message CommandMeta {
    string      request_id      = 1;
    string      source          = 2;
    AuthContext auth            = 3;
    uint64      timeout_ms      = 4;
    string      idempotency_key = 5;
    bool        dry_run         = 6;
    string      audit_reason    = 7;
}

// docs/00_design.md §5.3 frozen。**`confirmation`** 必须非空（gateway 验
// 证）；具体格式约束（如必须含 request_id 后缀 / 操作员姓名）v0.3 实施
// 时定，本 proto 不锁。
message ClearEStopCommand {
    CommandMeta meta         = 1;
    string      confirmation = 2;
}

// docs/00_design.md §5.3 通用 Ack 回执。
//
// 字段语义：
// - request_id：回传 ClearEStopCommand.meta.request_id，client correlation。
// - cleared_at_ns：daemon 端 clock.now()（CLOCK_MONOTONIC_RAW；
//   `clear_safety_latch` 完成时刻）；dry_run = true 时为 daemon 端"would
//   clear at"评估时刻；status != Ok 时为 0（gateway 用 tonic Status 转
//   error）。
// - dry_run：回传 request.dry_run，方便 client audit 不需 lookup request。
message Ack {
    string request_id    = 1;
    uint64 cleared_at_ns = 2;
    bool   dry_run       = 3;
}

// v0.3 A1 ClearEStop + v0.3 B4 task control plane + v0.5 候选 B read-only
// state plane RPCs。
//
// **method 数 = 8**（外部 tonic / HTTP/2 wire；内部 s1 RR server 仍仅 4
// 条 RR topic = task_invoke / task_cancel / task_status / clear_error；
// `StreamTaskEvents` 走 per-ActionId pubsub topic
// `/<robot_id>/s1/action_events/<action_id_hex>`；v0.5 候选 B `GetState` /
// `StreamState` **既不走 RR 也不走 s1**，gateway 直接读常驻 S0 state 订阅池
// （topic `/<robot_id>/s0/<hardware_id>/state`），详 team-swe Spec
// v0_5_get_stream_state §D4）。
service RobotControl {
    // v0.3 A1 land。safety-critical maintainer-only；详 clear_estop.fbs。
    rpc ClearEStop       (ClearEStopCommand)  returns (Ack);

    // v0.3 B4 task control plane。
    rpc InvokeTask       (InvokeTaskCommand)  returns (TaskHandle);
    rpc CancelTask       (CancelTaskCommand)  returns (Ack);
    rpc GetTaskStatus    (TaskHandleRef)      returns (TaskStatus);
    rpc StreamTaskEvents (TaskHandleRef)      returns (stream TaskEvent);
    rpc ClearError       (ClearErrorCommand)  returns (Ack);

    // v0.5 候选 B read-only state plane（additive；gateway 读常驻 S0 state
    // 订阅池，不走 s1 RR）。
    rpc GetState         (GetStateRequest)    returns (RobotState);
    rpc StreamState      (StreamRequest)      returns (stream RobotState);
}

// ===========================================================================
// v0.3 B4 task control plane messages
// ===========================================================================
//
// **跟 lib (`robot-s1::action`) 类型关系**：proto 字段语义跟 lib
// `ActionKind` / `ActionStatus` / `ActionEvent` / `ActionOutcome` /
// `ActionFailure` 一一对应；gateway 端做 proto ↔ lib 转换 + lib ↔ fbs
// （RR / pubsub）转换。三层 variant 集**严格同步**：lib 改 enum 必须
// 同步改 proto + fbs（详 docs/handoffs/v0.3_b4_outline.md §6.3 拍板）。

// `ActionKind` 的 typed enum 形态（reviewer round 4 拍板 #5a：typed
// 而**非** string，避免客户端拼错）。每加新 ActionKind 必须同步改
// proto + lib + fbs `ActionKindFb`。
enum ActionKindProto {
    ACTION_KIND_UNSPECIFIED = 0;
    ACTION_KIND_DWELL_MS    = 1;  // lib `ActionKind::DwellMs`（B2 mock）
    ACTION_KIND_HOLD_POSE   = 2;  // lib `ActionKind::HoldPose`（B3 land）
    ACTION_KIND_SCRIPTED    = 3;  // lib `ActionKind::Scripted`（v0.4 候选 1 land）
    ACTION_KIND_IK          = 4;  // lib `ActionKind::Ik`（v0.4 候选 2 round 2 land）
}

// 任务生命周期状态（对齐 lib `ActionStatus` enum + fbs `TaskStateFb`）。
//
// **B2 单 action 序列化**：`TASK_STATE_PENDING` 在 B2/B3 **不构造**
// （submit 即转 EXECUTING，无 queue 缓冲）；保留 variant 是为对齐
// B3+ scheduler 引入 queue 后的语义，让 RPC 字段集 stable。
enum TaskState {
    TASK_STATE_UNSPECIFIED = 0;
    TASK_STATE_PENDING     = 1;
    TASK_STATE_EXECUTING   = 2;
    TASK_STATE_COMPLETED   = 3;
    TASK_STATE_FAILED      = 4;
    TASK_STATE_CANCELLED   = 5;
}

// `ActionEvent` 的 typed enum 形态（对齐 fbs `ActionEventKindFb`）。
//
// 终止事件（COMPLETED / FAILED / CANCELLED）后 `StreamTaskEvents` 流
// 关闭；具体字段在 `TaskEvent.outcome` / `TaskEvent.failure`。
enum TaskEventKind {
    TASK_EVENT_KIND_UNSPECIFIED = 0;
    TASK_EVENT_KIND_STARTED     = 1;
    TASK_EVENT_KIND_PROGRESS    = 2;
    TASK_EVENT_KIND_COMPLETED   = 3;
    TASK_EVENT_KIND_FAILED      = 4;
    TASK_EVENT_KIND_CANCELLED   = 5;
}

// `ActionOutcome` (`Success` / `PartialSuccess { warning }`) 的 proto
// 形态。`PARTIAL_SUCCESS` 时 `warning` 必须非空字符串；`SUCCESS` 时
// `warning` 留空。
message ActionOutcomeProto {
    enum Kind {
        KIND_UNSPECIFIED     = 0;
        KIND_SUCCESS         = 1;
        KIND_PARTIAL_SUCCESS = 2;
    }
    Kind   kind    = 1;
    string warning = 2;
}

// `ActionFailure` 的 proto 形态（5 个 variant 对齐 lib 端）。
//
// `KIND_DEADLINE_EXCEEDED` 时 `reason` 留空；其它 4 个 variant 都带
// 具体 reason 字符串（gateway 端透传给 client）。
message ActionFailureProto {
    enum Kind {
        KIND_UNSPECIFIED         = 0;
        KIND_DEADLINE_EXCEEDED   = 1;
        KIND_PRECONDITION_FAILED = 2;
        KIND_ADAPTER_ERROR       = 3;
        KIND_SAFETY_ABORT        = 4;
        KIND_INTERNAL_ERROR      = 5;
    }
    Kind   kind   = 1;
    string reason = 2;
}

// `InvokeTaskCommand` —— client → gateway 提交 action。
//
// **字段语义**（reviewer round 2/3/4 拍板 + outline §6.2 锁定）：
// - `meta`：CommandMeta envelope；`meta.request_id` UUIDv7 直接转
//   `ActionId`（B2 outline §2.1 锁定，gateway 端无需翻译）。
// - `kind`：typed `ActionKindProto`（reviewer round 4 #5a 锁定）。
// - `deadline_ns`：CLOCK_MONOTONIC_RAW 截止时刻；gateway 端按
//   `now_ns + meta.timeout_ms * 1e6` 算（client 也可显式传，二选一）。
// - `priority`：B2 单 action 序列化下保留**不**参与决策；B3+ scheduler 用。
// - `payload_schema_id`：路由二级 key；`0` (= `NO_PAYLOAD_SCHEMA_ID`)
//   表示无 payload，此时 `payload` 必须为空。
// - `payload`：FlatBuffers body bytes（按 `payload_schema_id`）。B3
//   期间 HoldPose / MockDwell 都用空 payload。
message InvokeTaskCommand {
    CommandMeta     meta              = 1;
    ActionKindProto kind              = 2;
    uint64          deadline_ns       = 3;
    uint32          priority          = 4;
    uint32          payload_schema_id = 5;
    bytes           payload           = 6;
}

// `TaskHandle` —— `InvokeTask` reply。`action_id` UUIDv7 hex string
// （`robot_s1::action::ActionId` canonical form），client 用以发起
// `GetTaskStatus` / `CancelTask` / `StreamTaskEvents`。
message TaskHandle {
    string request_id = 1;
    string action_id  = 2;
}

// `TaskHandleRef` —— `GetTaskStatus` / `StreamTaskEvents` 共用 request
// 形态。**`request_id` 跟 `meta.request_id` 是同一个值**（GetTaskStatus
// / StreamTaskEvents 是只读 RPC，不带 CommandMeta；只用 request_id
// 做 audit + correlation）。
message TaskHandleRef {
    string request_id = 1;
    string action_id  = 2;
}

// `CancelTaskCommand` —— client → gateway 取消 action。`action_id`
// UUIDv7 hex string。cancel 是 cooperative；返 `Ack` 后**不保证** action
// 已停（事件流 `Cancelled` 走 `StreamTaskEvents`）。
message CancelTaskCommand {
    CommandMeta meta      = 1;
    string      action_id = 2;
}

// `ClearErrorCommand` —— client → gateway 清 coordinator `Degraded`
// 状态（B2 outline §10 决策 #5）。**maintainer+** 权限（reviewer round
// 2 阻断 4 + outline §8.1 #7c：rpc_roles.toml `[roles.operator]` 删
// `clear_error`，`[roles.maintainer]` / `[roles.admin]` 保留）。
//
// **跟 ClearEStop 不同**：`ClearError` 仅清内存状态，**不**碰磁盘
// EStop latch / **不**触发硬件 clear / **不**改 §6.7 任何不变量。
message ClearErrorCommand {
    CommandMeta meta = 1;
}

// `TaskStatus` —— `GetTaskStatus` reply / `StreamTaskEvents` 之外
// 的快照查询。
//
// 字段语义：
// - `request_id` / `action_id`：echo 回填 client correlation。
// - `state`：当前 task 生命周期。
// - `progress`：[0.0, 1.0]；仅 `state == TASK_STATE_EXECUTING` 有意义；
//   其它 state 填 0.0。
// - `outcome`：仅 `state == TASK_STATE_COMPLETED` 有意义（kind != UNSPECIFIED）。
// - `failure`：仅 `state == TASK_STATE_FAILED` 有意义（kind != UNSPECIFIED）。
message TaskStatus {
    string             request_id = 1;
    string             action_id  = 2;
    TaskState          state      = 3;
    float              progress   = 4;
    ActionOutcomeProto outcome    = 5;
    ActionFailureProto failure    = 6;
}

// `TaskEvent` —— `StreamTaskEvents` server-streaming 单帧。
//
// **保序**：单 ticket 内事件按时间顺序到达；**不**跨 ticket 保序。
// **终止**：每个 ticket 至多收到**一条**终态事件（COMPLETED / FAILED
// / CANCELLED）；流随后关闭。
//
// 字段语义：
// - `request_id` / `action_id`：correlation。
// - `at_ns`：事件时刻（CLOCK_MONOTONIC_RAW；s1 端 `clock.now()`）。
// - `event`：事件类型 tag。
// - `progress`：仅 `event == TASK_EVENT_KIND_PROGRESS` 有意义；其它
//   留 0.0。
// - `outcome`：仅 `event == TASK_EVENT_KIND_COMPLETED` 有意义。
// - `failure`：仅 `event == TASK_EVENT_KIND_FAILED` 有意义。
message TaskEvent {
    string             request_id = 1;
    string             action_id  = 2;
    uint64             at_ns      = 3;
    TaskEventKind      event      = 4;
    float              progress   = 5;
    ActionOutcomeProto outcome    = 6;
    ActionFailureProto failure    = 7;
}

// ===========================================================================
// v0.5 候选 B read-only state plane messages（additive）
// ===========================================================================
//
// design §5.3 两条只读 RPC `GetState` / `StreamState` 的 wire 形态。权威数据源
// = S0 state topic（gateway 订阅 `/<robot_id>/s0/<hardware_id>/state` 上 S0
// 发布的 fbs `JointState`），gateway 进程内转 proto `RobotState`（robot-rpc
// `state_convert.rs`，fbs→proto 单向；**不**进 robot-msg schema registry / 不
// 加 fbs 平行表）。
//
// **enum 镜像（三层同步纪律）**：以下 4 个 enum number 与 robot-msg
// `joint.fbs` 同名 enum 严格 1:1（`S0Mode` / `S0ControlLink` / `S0OutputMode`
// / `S0SafetyState`）；proto3 零值约定 `*_UNSPECIFIED = 0` 对齐 fbs
// `Unknown = 0` / `TorqueUnknown = 0`。fbs↔proto 转换在 `state_convert.rs`
// 逐 variant + variant-count 锁测防漂移（team-swe Spec §P.2.1）。

// 镜像 fbs `S0Mode`（joint.fbs）。S0 主状态机 5 主态。
enum S0Mode {
    S0_MODE_UNSPECIFIED = 0;  // fbs Unknown（兼容旧 writer）
    S0_MODE_SAFE        = 1;
    S0_MODE_READY       = 2;
    S0_MODE_ENABLED     = 3;
    S0_MODE_FAULT       = 4;
    S0_MODE_STOPPING    = 5;
}

// 镜像 fbs `S0ControlLink`（joint.fbs）。控制链路（S1 心跳）状态。
enum S0ControlLink {
    S0_CONTROL_LINK_UNSPECIFIED = 0;  // fbs Unknown
    S0_CONTROL_LINK_OK          = 1;
    S0_CONTROL_LINK_LOST        = 2;
}

// 镜像 fbs `S0OutputMode`（joint.fbs）。输出模式（与 S0 子态对应）。
enum S0OutputMode {
    S0_OUTPUT_MODE_UNSPECIFIED = 0;  // fbs Unknown
    S0_OUTPUT_MODE_ACTIVE      = 1;
    S0_OUTPUT_MODE_HOLD        = 2;
    S0_OUTPUT_MODE_ZERO        = 3;
    S0_OUTPUT_MODE_STOP        = 4;
}

// 镜像 fbs `S0SafetyState`（joint.fbs）。输出 safety 状态；number 与
// robot_core::executor_ctrl::OutputSafetyState 1:1（fbs 注释锁定，禁错位）。
enum S0SafetyState {
    S0_SAFETY_STATE_TORQUE_UNKNOWN       = 0;  // fbs TorqueUnknown
    S0_SAFETY_STATE_TORQUE_ON            = 1;
    S0_SAFETY_STATE_STOP_COMMANDED       = 2;
    S0_SAFETY_STATE_TORQUE_OFF_CONFIRMED = 3;
    S0_SAFETY_STATE_STOP_FAILED          = 4;
    S0_SAFETY_STATE_ADAPTER_UNCERTAIN    = 5;
}

// `GetState` request —— 显式 hardware selector。`hardware_id` 必填非空：
// 缺/空 → InvalidArgument；未知（不在 gateway `--config` 声明的 hardware 池）
// → NotFound；已知但常驻池无首帧 → Unavailable（详 team-swe Spec §D9）。
message GetStateRequest {
    string hardware_id = 1;
}

// `StreamState` request —— hardware selector + 节流下限。
// `min_interval_ms`：0 = gateway 默认下限（50ms）；0 < x < 20 → clamp 20ms；
// >= 20 → 原值（详 team-swe Spec §D5）。
message StreamRequest {
    string hardware_id     = 1;
    uint32 min_interval_ms = 2;
}

// `GetState` reply / `StreamState` 单帧 —— 单个 hardware 的 S0 state 快照
// （per-hardware，**不**聚合）。字段镜像 fbs `JointState` 的 s0_* +
// position/layout/stamp（gateway `state_convert.rs` 转换）。
//
// 字段语义：
// - robot_id / hardware_id：本快照所属（gateway 注入，来自订阅 topic）。
// - layout_id：JointState.layout_id 透传。
// - stamp_ns：JointState.stamp_ns 透传（S0 published，CLOCK_MONOTONIC_RAW；
//   **非** gateway 自生 clock）。
// - position_rad：JointState.position_rad 透传。
// - mode / control_link / output_mode / safety_state：经 4 enum 转换器。
// - fault_code：JointState.s0_fault_code 的数值 uint32 透传（**不** enum 化；
//   保留 design D6 决策，避免预钉 fault 码表）。
message RobotState {
    string          robot_id     = 1;
    string          hardware_id  = 2;
    uint64          layout_id    = 3;
    uint64          stamp_ns     = 4;
    repeated double position_rad = 5;
    S0Mode          mode         = 6;
    S0ControlLink   control_link = 7;
    S0OutputMode    output_mode  = 8;
    S0SafetyState   safety_state = 9;
    uint32          fault_code   = 10;
}
