[package]
name         = "robot-rpc"
description  = "v0.3 A1 ClearEStop control-plane slice gateway。A1-3 (2/3) 起包含 robot-gateway binary（loopback-only tonic gRPC server + iceoryx2 RR client → robot-s0）。"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

# Scope（reviewer A1-1 + A1-3 (2/3) 拍板硬边界）：
# - lib：`proto` 模块（tonic codegen）+ `auth` / `idempotency` / `clear_estop`
#   纯函数 + `gateway` 模块（A1-3 (2/3-a) 起加；ClearEStopHandler + RR I/O
#   thread + Gateway 服务端类型）。
# - bin：`robot-gateway` 独立进程（A1-3 (2/3-a) 起加）；loopback-only
#   bind；不暴露外网；fake token + plain TCP（v0.3）；TLS / mTLS 留 v0.4+。
# - S0 状态变更走 control action，不直接修改 daemon 状态或保护文件。
# - `--allow-empty-latch` / `MissingLatchPolicy::AllowEmpty` **已由 A1-5
#   撤销**（commit `45df648`）；strict fail-closed 是 latch 缺失唯一
#   行为，§6.7 #3 真宣称升级登记走 docs/CHANGELOG.md 2026-04-28
#   "v0.3 A1-5" 偏离登记。
# - tonic / prost / uuid 引入登记见 docs/CHANGELOG.md 2026-04-27
#   "v0.3 A1-1 (3/3) robot-rpc / tonic / prost / uuid / blake3 依赖白名单
#   登记"。tonic transport feature + tokio + crossbeam-channel + iceoryx2
#   + robot-transport + robot-logging + flatbuffers 见 2026-04-28
#   "A1-3 (2/3) robot-gateway binary 依赖" 偏离登记。

[dependencies]
robot-core = { workspace = true }
# 状态页原位校验复用纯换算，不启用 real-hw。
robot-adapter-feetech = { workspace = true, optional = true }
# robot-msg 复用 ClearEStopRequest / ClearEStopResponse / RpcRole / RpcStatus
# wire types（A1-1 part 1 落地）；A1-3 (2/3) gateway 真接 daemon 时构造
# wire bytes 用 build_helpers + flatbuffers root。
robot-msg = { workspace = true }
# tonic / prost：gRPC server runtime + Protobuf runtime。**仅** robot-rpc
# 用；其它 crate 禁 link。A1-3 (2/3) 起开 transport feature 跑 server。
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
# audit log。
tracing = { workspace = true }
# UUIDv7 验证 CommandMeta.request_id 格式。
uuid = { workspace = true }
# configs/rpc-roles.toml 加载。
serde = { workspace = true }
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
jpeg-encoder = { workspace = true, optional = true }
toml  = { workspace = true }
# Error 派生。
thiserror = { workspace = true }
# blake3：idempotency cache 的 payload hash（同 key 不同 payload 检测）。
blake3 = { workspace = true }
# A1-3 (2/3-a) 起加：tonic transport stack 跑 async server 必须的 tokio
# runtime。Async 边界严格在 gateway 进程内，不进 daemon / 其它 crate。
tokio = { workspace = true }
# A1-3 (2/3-b) 起 RR I/O 独立 std::thread 转发 wire request / wire response
# 用 crossbeam-channel；handler 等 RR response 用 tokio::sync::oneshot
# （在 tokio 自带 sync feature 中）。
crossbeam-channel = { workspace = true }
# iceoryx2：跨进程 RR client 端，跟 robot-s0 端 rr_server_thread 共服务。
iceoryx2 = { workspace = true }
# robot-transport：rr_client 单端工厂（A1-1 part 2 spike）。
robot-transport = { workspace = true }
# robot-logging：bin main 调一次统一 tracing subscriber init。
robot-logging = { workspace = true }
# flatbuffers：handler 端 decode wire ClearEStopResponse 用
# `flatbuffers::root::<FbResp>(bytes)`；跟 robot-msg::build_helpers 同源。
flatbuffers = { workspace = true }
# v0.5 候选 E 段(8)（Spec PD-E6(c) + D12）：sd_notify + liveness-gated watchdog
# 单一实现（工作区内部依赖边，0 新外部 crate）。
robot-health = { workspace = true }

[build-dependencies]
tonic-prost-build   = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
tokio-tungstenite = { workspace = true }
# W3 仅测试读取真实结构化补偿日志。
serde_json = { workspace = true }
# 段(4) client::layout 单测临时 config 文件。
tempfile = { workspace = true }
# B4 (3/3) cross-process integration test (`tests/task_rpc_e2e.rs`) 需 spawn
# robot-s1 + robot-gateway 双子进程 + drain stderr / stdout + forensic
# dump 到 `/tmp/b4_e2e/<robot_id>/`：
# - tokio `process` feature：tokio::process::Command spawn + Child + kill_on_drop
# - tokio `fs` feature：forensic dump 到磁盘
# - tokio `io-util` feature：AsyncBufReadExt / Lines drain stderr / stdout
# 生产 lib dep 仍走 workspace 默认 features；本 dev-deps 仅 e2e harness 用。
tokio = { workspace = true, features = ["process", "fs", "io-util"] }
# libc::kill(pid, SIGTERM) 给子进程发软停止信号（tokio::process::Child::kill
# 是硬 SIGKILL，没 grace；e2e harness 必须先 SIGTERM 让子进程 graceful
# shutdown）。沿 A1 e2e clear_estop_e2e.rs 同款。
libc = { workspace = true }
# robot-core: FakeStatePublisher 用 SystemClock::now() 拿 monotonic ns 填
# JointState.stamp_ns，跟 robot-s1 `read_anchor_from_s0_state` 比较的
# clock domain 一致（CLOCK_MONOTONIC_RAW）；否则 stamp_ns=0 会立即被
# `max_stale_ms=200ms` 判 stale，s1 anchor exit 4。
robot-core = { workspace = true }

[features]
# **A1-3 (3/3-a)** 拍板：默认**不**生成 tonic gRPC client stub（生产
# `robot-gateway` binary 是 server，dimos / Web UI 是 client，client
# 不在 robot-system workspace 内）。开启 `client` feature 让 build.rs 跑
# `tonic_build::configure().build_client(true)`，让 robot-tests 端的两进程
# 端到端 smoke (`crates/robot-tests/src/bin/clear_estop_e2e.rs`) 能直接调
# `RobotControlClient::clear_e_stop`。生产二进制构建保持默认 features，
# **不**带 `client`，无 client-only runtime 影响。
#
# **B4 (3/3)** 同款：`crates/robot-rpc/tests/task_rpc_e2e.rs` 用
# `RobotControlClient::{invoke_task, cancel_task, get_task_status,
# stream_task_events, clear_error}` 5 method，由下方 `[[test]]
# required-features = ["client"]` 守门。
#
# **v0.5 候选 A (1/5) 起更新（workspace feature unification）**：robot-cli
# 无条件依赖 `robot-rpc = { features = ["client"] }`，故 `cargo test
# --workspace` 解析时 robot-rpc 必带 `client` → required-features 被满足
# → task_rpc_e2e **默认随 workspace 跑**（不再"默认跳过"）。这是测试覆盖
# 增加、非生产路径放宽：`robot-gateway` 等生产二进制单独构建仍不带
# `client`（不依赖 robot-cli），无 client-only runtime 影响。
client = []
# HTTP/WebSocket状态与控制页；控制缺省关闭，不改变robot-gateway默认构建。
status-web = ["client", "dep:axum", "dep:futures-util", "dep:serde_json", "dep:jpeg-encoder", "dep:robot-adapter-feetech"]
# v0.5 候选 E 段(8)（Spec P.2.7 R5-5/R6-5）：test-only freeze hook——cfg 守门
# `liveness::freeze_check` + `freeze_control`（`/<robot_id>/gateway/test/freeze`
# 注入线程 + `TestFreezeCommandV2` / `WorkerKind` pub 导出给 sd_watchdog_smoke
# import）。**永不进 default features / 生产 release**；与 `client` 正交、并存
# additive 无害——robot-tests `sd-watchdog-smoke` **只**启用本 feature，**不**
# 启用 `client`（合并 feature 构建时 client 可能被其它 smoke feature 经 feature
# unification 拉起，与本 feature 无关；段(8) round 2 更正原"同时启用两者"表述）。
test-freeze-hook = []
# R4c 仅借原网关责任的两处事实，不改变缓存/队列/许可。
test-comm-fault-hook = []
# R3 原连接故障门，仅测试显式转发，不进入默认或机器人生产组合。
test-rr-fixtures = ["robot-transport/test-rr-fixtures"]

[[test]]
# v0.5 候选 E 段(7)：双臂 workflow cross-process e2e（2×(s0+s1+gateway) = 6
# 子进程；三真同堂首例，D9）。`required-features = ["client"]` 守门，跟既有
# 四个 e2e 同款——workspace feature unification 下 robot-cli 无条件启用
# `robot-rpc/client`，故 `cargo test --workspace` 默认会跑。
#
# **运行前置**（P.0 活清单）：`cargo build --release --workspace` +
# `cargo build --release -p robot-s1 --bin robot-s1 --features
# test-fault-backend`（AC-E14 执行期 failure / AC-E18 failure 分支需要
# test-only fault backend；漏编时仅这两个 case bring-up 失败）。
name = "dimos_workflow_e2e"
path = "tests/dimos_workflow_e2e.rs"
required-features = ["client"]

[[test]]
# B4 (3/3) cross-process e2e：required-features = ["client"] 守门。自 v0.5
# 候选 A (1/5) workspace feature unification 起，`cargo test --workspace`
# 默认带 client → 本 e2e 默认随 workspace 跑（详上方 `client` feature 注释）。
name = "task_rpc_e2e"
path = "tests/task_rpc_e2e.rs"
required-features = ["client"]

[[test]]
# v0.5 候选 B (4/4) GetState/StreamState cross-process e2e：同 task_rpc_e2e
# 由 required-features = ["client"] 守门 → workspace feature unification 下
# 默认随 `cargo test --workspace` 跑（A4）。gateway-only（不起 s1）：state
# RPC 读 gateway 常驻 state 池（FakeStatePublisher 喂），不经 s1。
name = "state_rpc_e2e"
path = "tests/state_rpc_e2e.rs"
required-features = ["client"]

[[test]]
# v0.5 候选 C (5/5) SetEnabled cross-process e2e：robot-s0（真）+ fake
# heartbeat（扮演 s1 心跳源，D-P3）+ gateway。required-features = ["client"]
# 守门 → workspace feature unification 下默认随 `cargo test --workspace` 跑。
name = "set_enabled_e2e"
path = "tests/set_enabled_e2e.rs"
required-features = ["client"]

[[test]]
# v0.5 候选 D (2/3) EStop 触发 RPC cross-process e2e：robot-s0（真）+
# gateway + harness estop-topic 订阅计数线程（PD1）+ fake heartbeat（按需）。
# required-features = ["client"] 守门 → 默认随 `cargo test --workspace` 跑。
name = "estop_e2e"
path = "tests/estop_e2e.rs"
required-features = ["client"]

[[test]]
name = "w3_gateway_owned"
path = "tests/w3_gateway_owned.rs"
required-features = ["client", "test-freeze-hook"]

[[bin]]
name = "robot-status"
path = "src/bin/robot-status.rs"
required-features = ["status-web"]

[lints]
workspace = true
