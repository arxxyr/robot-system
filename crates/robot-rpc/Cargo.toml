[package]
name         = "robot-rpc"
description  = "v0.3 A1 ClearEStop control-plane slice gateway 骨架（不起 server binary，全纯单测）。"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

# A1-1 (3/3) scope（reviewer A1-1 拍板硬边界）：
# - 仅 lib 导出 `proto` 模块（tonic codegen） + `auth` / `idempotency` /
#   `clear_estop` 三块纯函数。
# - 全纯单测；**不**起 server binary（无 `[[bin]]`）。
# - **不**接 S0 mutation；**不**删 `--allow-empty-latch`；**不**宣称 §6.7
#   #3 真锁住。
# - tonic / prost / uuid 引入登记走 docs/CHANGELOG.md（A1-2 落地时一起
#   登记）。

[dependencies]
robot-core = { workspace = true }
# robot-msg 复用 ClearEStopRequest / ClearEStopResponse / RpcRole / RpcStatus
# wire types（A1-1 part 1 落地）。robot-rpc 内部把 RPC layer 入参转 wire
# bytes（A1-2 真接 daemon 时通过 robot-transport RR client publish）。
robot-msg = { workspace = true }
# tonic / prost：gRPC server runtime + Protobuf runtime。**仅** A1-1 (3/3)
# / A1-3 用；其它 crate 禁 link。
tonic = { workspace = true }
prost = { workspace = true }
# audit log。
tracing = { workspace = true }
# UUIDv7 验证 CommandMeta.request_id 格式。
uuid = { workspace = true }
# configs/rpc_roles.toml 加载。
serde = { workspace = true }
toml  = { workspace = true }
# Error 派生。
thiserror = { workspace = true }
# blake3：idempotency cache 的 payload hash（同 key 不同 payload 检测）。
blake3 = { workspace = true }

[build-dependencies]
tonic-build         = { workspace = true }
protoc-bin-vendored = { workspace = true }

[lints]
workspace = true
