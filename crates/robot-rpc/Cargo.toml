[package]
name         = "robot-rpc"
description  = "v0.3 A1 ClearEStop control-plane slice gateway。A1-3 (2/3) 起包含 robot_rpc_gateway binary（loopback-only tonic gRPC server + iceoryx2 RR client → s0_daemon）。"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

# Scope（reviewer A1-1 + A1-3 (2/3) 拍板硬边界）：
# - lib：`proto` 模块（tonic codegen）+ `auth` / `idempotency` / `clear_estop`
#   纯函数 + `gateway` 模块（A1-3 (2/3-a) 起加；ClearEStopHandler + RR I/O
#   thread + Gateway 服务端类型）。
# - bin：`robot_rpc_gateway` 独立进程（A1-3 (2/3-a) 起加）；loopback-only
#   bind；不暴露外网；fake token + plain TCP（v0.3）；TLS / mTLS 留 v0.4+。
# - **不**接 S0 mutation；S0 状态变更全走 ClearEStop control action
#   （A1 全链路 land；详 docs/handoffs/v0.3_a1_4_clear_estop_smoke.md §5）。
# - `--allow-empty-latch` / `MissingLatchPolicy::AllowEmpty` **已由 A1-5
#   撤销**（commit `45df648`）；strict fail-closed 是 latch 缺失唯一
#   行为，§6.7 #3 真宣称升级登记走 docs/CHANGELOG.md 2026-04-28
#   "v0.3 A1-5" 偏离登记。
# - tonic / prost / uuid 引入登记见 docs/CHANGELOG.md 2026-04-27
#   "v0.3 A1-1 (3/3) robot-rpc / tonic / prost / uuid / blake3 依赖白名单
#   登记"。tonic transport feature + tokio + crossbeam-channel + iceoryx2
#   + robot-transport + robot-logging + flatbuffers 见 2026-04-28
#   "A1-3 (2/3) robot_rpc_gateway binary 依赖" 偏离登记。

[dependencies]
robot-core = { workspace = true }
# robot-msg 复用 ClearEStopRequest / ClearEStopResponse / RpcRole / RpcStatus
# wire types（A1-1 part 1 落地）；A1-3 (2/3) gateway 真接 daemon 时构造
# wire bytes 用 build_helpers + flatbuffers root。
robot-msg = { workspace = true }
# tonic / prost：gRPC server runtime + Protobuf runtime。**仅** robot-rpc
# 用；其它 crate 禁 link。A1-3 (2/3) 起开 transport feature 跑 server。
tonic = { workspace = true }
prost = { workspace = true }
# audit log。
tracing = { workspace = true }
# UUIDv7 验证 CommandMeta.request_id 格式。
uuid = { workspace = true }
# configs/rpc_roles.toml 加载。
serde = { workspace = true }
toml  = { workspace = true }
# Error 派生。
thiserror = { workspace = true }
# blake3：idempotency cache 的 payload hash（同 key 不同 payload 检测）。
blake3 = { workspace = true }
# A1-3 (2/3-a) 起加：tonic transport stack 跑 async server 必须的 tokio
# runtime。Async 边界严格在 gateway 进程内，不进 daemon / 其它 crate。
tokio = { workspace = true }
# A1-3 (2/3-b) 起 RR I/O 独立 std::thread 转发 wire request / wire response
# 用 crossbeam-channel；handler 等 RR response 用 tokio::sync::oneshot
# （在 tokio 自带 sync feature 中）。
crossbeam-channel = { workspace = true }
# iceoryx2：跨进程 RR client 端，跟 s0_daemon 端 rr_server_thread 共服务。
iceoryx2 = { workspace = true }
# robot-transport：rr_client 单端工厂（A1-1 part 2 spike）。
robot-transport = { workspace = true }
# robot-logging：bin main 调一次统一 tracing subscriber init。
robot-logging = { workspace = true }
# flatbuffers：handler 端 decode wire ClearEStopResponse 用
# `flatbuffers::root::<FbResp>(bytes)`；跟 robot-msg::build_helpers 同源。
flatbuffers = { workspace = true }

[build-dependencies]
tonic-build         = { workspace = true }
protoc-bin-vendored = { workspace = true }

[features]
# **A1-3 (3/3-a)** 拍板：默认**不**生成 tonic gRPC client stub（生产
# `robot_rpc_gateway` binary 是 server，dimos / Web UI 是 client，client
# 不在 robot-system workspace 内）。开启 `client` feature 让 build.rs 跑
# `tonic_build::configure().build_client(true)`，让 robot-tests 端的两进程
# 端到端 smoke (`crates/robot-tests/src/bin/clear_estop_e2e.rs`) 能直接调
# `RobotControlClient::clear_e_stop`。生产二进制构建保持默认 features，
# **不**带 `client`，无 client-only runtime 影响。
client = []

[lints]
workspace = true
