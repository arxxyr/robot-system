<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>机器人状态 · robot-system</title>
  <style>
    :root { --ink: #19334b; --muted: #62758a; --line: #dce5ec; --paper: #fff; --bg: #f4f7fa; --blue: #205b90; --green: #246d51; --amber: #946000; --red: #a63d39; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; }
    button { border: 1px solid transparent; border-radius: 7px; padding: 9px 17px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    button:disabled { cursor: default; opacity: .55; }
    button:focus-visible { outline: 3px solid #91b9db; outline-offset: 3px; }
    .primary { color: #fff; background: var(--blue); }
    .primary:hover:not(:disabled) { background: #174b79; }
    .secondary { color: var(--ink); background: #fff; border-color: var(--line); }
    .secondary:hover:not(:disabled) { background: #f3f7fa; }
    header { background: var(--paper); border-bottom: 1px solid var(--line); }
    .topbar { max-width: 1280px; margin: auto; padding: 19px 32px; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { font-size: 18px; font-weight: 750; letter-spacing: -.4px; display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 27px; height: 27px; background: var(--blue); border-radius: 6px; display: inline-grid; grid-template-columns: repeat(2, 5px); gap: 4px; place-content: center; }
    .brand-mark i { background: #fff; border-radius: 1px; width: 5px; height: 5px; }
    .readonly { color: var(--muted); font-size: 13px; }
    main { max-width: 1280px; margin: 0 auto; padding: 34px 32px 28px; }
    .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; margin-bottom: 25px; }
    h1 { margin: 0 0 6px; font-size: clamp(25px, 3vw, 31px); letter-spacing: -.7px; line-height: 1.35; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }
    .connection { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #8d9ead; flex: none; }
    .connection[data-tone="good"] .dot { background: #2c8762; }
    .connection[data-tone="warn"] .dot { background: #c08b28; }
    .connection[data-tone="bad"] .dot { background: #b34b48; }
    .access { border: 1px solid var(--line); border-radius: 11px; background: var(--paper); padding: 19px 22px; margin-bottom: 26px; }
    .connection-actions { display: flex; align-items: center; gap: 11px; }
    .access-note { color: var(--muted); margin: 9px 0 0; font-size: 12px; }
    #notice { font-size: 13px; margin: 12px 0 0; color: var(--red); overflow-wrap: anywhere; }
    #notice:empty { display: none; }
    .section-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 12px; }
    .section-row h2 { font-size: 16px; margin: 0; }
    .section-row span { font-size: 12px; color: var(--muted); }
    .buses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
    .empty { grid-column: 1 / -1; background: #fff; border: 1px dashed #bdccd8; border-radius: 11px; min-height: 264px; padding: 62px 22px; text-align: center; }
    .empty strong { display: block; font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .empty p { margin: 0; font-size: 14px; color: var(--muted); }
    .bus { border: 1px solid var(--line); border-radius: 11px; background: #fff; overflow: hidden; }
    .bus-heading { padding: 21px 22px 17px; border-bottom: 1px solid var(--line); }
    .bus-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .bus h3 { margin: 0; font-size: 19px; letter-spacing: -.3px; }
    .bus-id { margin: 4px 0 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .badge { display: inline-flex; align-items: center; border: 1px solid #d8e2ea; border-radius: 30px; font-size: 12px; font-weight: 600; padding: 3px 10px; white-space: nowrap; background: #f2f5f8; color: #566b7e; }
    .badge[data-tone="good"] { background: #eef8f2; border-color: #cce7d7; color: var(--green); }
    .badge[data-tone="warn"] { background: #fff6e5; border-color: #edd9af; color: var(--amber); }
    .badge[data-tone="bad"] { background: #fff0ee; border-color: #efceca; color: var(--red); }
    .metrics { padding: 18px 22px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
    .metric dt { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
    .metric dd { margin: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
    .metric dd[data-tone="bad"] { color: var(--red); }
    .metric dd[data-tone="warn"] { color: var(--amber); }
    .metric dd[data-tone="good"] { color: var(--green); }
    .state-note { margin: 0 22px 15px; padding: 9px 11px; border-radius: 6px; background: #f5f8fb; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .state-note[data-tone="warn"] { background: #fff7e9; color: var(--amber); }
    .state-note[data-tone="bad"] { background: #fff1ef; color: var(--red); }
    .table-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    thead { background: #f7f9fb; }
    th { font-size: 12px; font-weight: 500; text-align: left; color: var(--muted); padding: 10px 16px; white-space: nowrap; }
    td { padding: 11px 16px; border-top: 1px solid #edf1f5; vertical-align: middle; }
    th:first-child, td:first-child { padding-left: 22px; }
    th:last-child, td:last-child { padding-right: 22px; text-align: right; }
    .joint-name { display: block; font-weight: 550; overflow-wrap: anywhere; min-width: 105px; }
    .joint-key { display: block; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; line-height: 1.35; margin-top: 2px; }
    .motor-id { font-variant-numeric: tabular-nums; color: var(--muted); }
    .position { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .position small { display: block; font-size: 11px; color: var(--muted); }
    .bus[data-fresh="false"] .position { color: var(--muted); }
    .bus-foot { padding: 10px 22px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
    .camera-section { margin-top: 28px; }
    .camera-actions { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .camera-actions p { margin: 0; color: var(--muted); font-size: 12px; }
    .cameras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .camera { border: 1px solid var(--line); border-radius: 11px; background: var(--paper); overflow: hidden; }
    .camera-heading { padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .camera h3 { margin: 0; font-size: 15px; }
    .camera-frame { aspect-ratio: 4 / 3; background: #eaf0f5; position: relative; display: grid; place-items: center; overflow: hidden; }
    .camera-frame img { width: 100%; height: 100%; object-fit: contain; position: absolute; }
    .camera-frame img[hidden] { display: none; }
    .camera-placeholder { padding: 20px; color: var(--muted); text-align: center; font-size: 13px; }
    .camera-meta { margin: 0; padding: 10px 15px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    #camera-notice { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    #camera-notice:empty { display: none; }
    footer { margin-top: 23px; color: var(--muted); font-size: 12px; }
    footer p { margin: 4px 0; }
    @media (max-width: 900px) { .buses { grid-template-columns: 1fr; } .cameras { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .cameras { grid-template-columns: 1fr; } .camera-actions { align-items: flex-start; flex-direction: column; gap: 8px; } }
    @media (max-width: 560px) { .topbar { padding: 15px 18px; } main { padding: 24px 16px; } .title-row { flex-direction: column; gap: 5px; } .connection { margin-top: 2px; } .access { padding: 16px; } .connection-actions { flex-wrap: wrap; } button { flex: 1; } .bus-heading, .metrics { padding-left: 16px; padding-right: 16px; } .state-note { margin-left: 16px; margin-right: 16px; } th:first-child, td:first-child { padding-left: 16px; } th:last-child, td:last-child { padding-right: 16px; } th, td { padding-left: 9px; padding-right: 9px; } .readonly { font-size: 12px; } }
  </style>
</head>
<body>
  <header><div class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>robot-system</div><span class="readonly">只读监控 · 不下发控制命令</span></div></header>
  <main>
    <div class="title-row">
      <div><h1>机器人状态</h1><p class="subtitle">查看总线反馈、关节位置、保护状态与相机画面。</p></div>
      <div id="connection" class="connection" data-tone="neutral" role="status"><span class="dot" aria-hidden="true"></span><span id="connection-text">尚未连接</span></div>
    </div>
    <section class="access" aria-label="只读访问">
      <div class="connection-actions">
        <button id="connect" class="primary" type="button">连接查看</button>
        <button id="disconnect" class="secondary" type="button" disabled>断开查看</button>
      </div>
      <p class="access-note">连接后持续接收状态；断开查看不会改变机器人状态。</p>
      <p id="notice" role="alert"></p>
    </section>
    <section aria-label="总线状态">
      <div class="section-row"><h2>总线与关节</h2><span id="summary">等待状态数据</span></div>
      <div id="buses" class="buses"><div class="empty"><strong>尚未连接状态源</strong><p>连接后，按当前机器人配置显示设备及反馈。没有反馈时保留“未知”。</p></div></div>
    </section>
    <section class="camera-section" aria-label="相机预览">
      <div class="section-row"><h2>相机画面</h2><span id="camera-summary">低帧率预览</span></div>
      <div class="camera-actions"><button id="camera-toggle" class="secondary" type="button" aria-pressed="false">查看画面</button><p>画面独立连接；暂停或切到后台时停止读取。</p></div>
      <p id="camera-notice" role="status">点击“查看画面”读取当前配置的相机。</p>
      <div id="cameras" class="cameras"></div>
    </section>
    <footer><p>总线级扭矩状态不等于逐电机独立确认；服务在线或软件处于 Safe 均不代表已经断扭。</p><p>“陈旧”表示最后一次反馈，仅供参考；此页面不提供使能、运动或急停操作。</p></footer>
  </main>
  <script>
    (() => {
      'use strict';
      const elements = Object.fromEntries(['connect', 'disconnect', 'connection', 'connection-text', 'notice', 'summary', 'buses', 'camera-toggle', 'camera-summary', 'camera-notice', 'cameras'].map(id => [id, document.getElementById(id)]));
      const modeText = { Safe: 'Safe · 安全态', Ready: 'Ready · 就绪', Enabled: 'Enabled · 已使能', Fault: 'Fault · 故障', Stopping: 'Stopping · 停止中' };
      const linkText = { Ok: '正常', Lost: '已丢失' };
      const outputText = { Active: '执行输出', Hold: '保持', Zero: '零输出', Stop: '停止输出' };
      const safetyText = { TorqueUnknown: '扭矩未知', TorqueOn: '总线上扭', StopCommanded: '已请求停止', TorqueOffConfirmed: '已确认断扭', StopFailed: '停止失败', AdapterUncertain: '未确认' };
      const statusText = { fresh: '反馈新鲜', stale: '反馈陈旧', unavailable: '无可用反馈', invalid: '反馈不匹配' };
      const jointLabels = { shoulder_pan: '肩部旋转', shoulder_lift: '肩部抬升', elbow_flex: '肘关节', wrist_flex: '腕部俯仰', wrist_roll: '腕部旋转', gripper: '夹爪', head_motor_1: '头部关节 1', head_motor_2: '头部关节 2', base_left_wheel: '左轮', base_front_wheel: '前轮', base_right_wheel: '右轮' };
      let activeSession = null;
      let snapshot = null;
      let receivedAt = 0;
      let connected = false;
      let preview = null;
      let cameraCards = [];

      function node(tag, className, value) {
        const result = document.createElement(tag);
        if (className) result.className = className;
        if (value !== undefined) result.textContent = value;
        return result;
      }
      function valueText(value, labels) {
        if (value === null || value === undefined || value === '') return '未知';
        return labels[value] || `未知（${String(value)}）`;
      }
      function jointLabel(name) {
        const key = name.replace(/^(left|right)_arm_/, '');
        return jointLabels[key] || name;
      }
      function elapsedMs() { return Math.max(0, performance.now() - receivedAt); }
      function ageOf(bus) {
        return Number.isFinite(bus.age_ms) && bus.age_ms >= 0 ? bus.age_ms + elapsedMs() : null;
      }
      function statusOf(bus) {
        if (bus.data_status !== 'fresh') return Object.hasOwn(statusText, bus.data_status) ? bus.data_status : 'invalid';
        const age = ageOf(bus);
        if (!connected || typeof bus.stamp_ns !== 'string' || !/^[1-9]\d*$/.test(bus.stamp_ns) || age === null || age > snapshot.stale_after_ms) return 'stale';
        return 'fresh';
      }
      function ageText(age) {
        if (age === null) return '未知';
        return age < 1000 ? `${Math.round(age)} ms 前` : `${(age / 1000).toFixed(1)} s 前`;
      }
      function setConnection(text, tone) {
        elements['connection-text'].textContent = text;
        elements.connection.dataset.tone = tone;
      }
      function metric(parent, label, value, tone) {
        const item = node('div', 'metric');
        item.append(node('dt', '', label));
        const content = node('dd', '', value);
        if (tone) content.dataset.tone = tone;
        item.append(content);
        parent.append(item);
      }
      function stateTone(bus, status) {
        if (bus.mode === 'Fault' || bus.safety_state === 'StopFailed') return 'bad';
        if (status !== 'fresh') return 'warn';
        if (bus.safety_state === 'TorqueUnknown' || bus.safety_state === 'AdapterUncertain' || !Object.hasOwn(safetyText, bus.safety_state)) return 'warn';
        return undefined;
      }
      function renderBus(bus) {
        const status = statusOf(bus);
        const age = ageOf(bus);
        const article = node('article', 'bus');
        article.dataset.fresh = String(status === 'fresh');
        const heading = node('div', 'bus-heading');
        const titleRow = node('div', 'bus-title-row');
        titleRow.append(node('h3', '', bus.label || bus.id));
        const badge = node('span', 'badge', statusText[status]);
        badge.dataset.tone = status === 'fresh' ? 'good' : status === 'invalid' ? 'bad' : 'warn';
        titleRow.append(badge);
        heading.append(titleRow, node('p', 'bus-id', `${bus.id} · ${bus.robot_id}`));
        article.append(heading);

        const metrics = node('dl', 'metrics');
        const hasReportedState = [bus.mode, bus.safety_state, bus.control_link, bus.output_mode, bus.fault_code].some(value => value !== null && value !== undefined);
        const old = status !== 'fresh' && hasReportedState ? '（最后报告）' : '';
        metric(metrics, `软件状态${old}`, valueText(bus.mode, modeText), stateTone(bus, status));
        metric(metrics, `扭矩确认${old}`, valueText(bus.safety_state, safetyText), stateTone(bus, status));
        metric(metrics, `控制链路${old}`, valueText(bus.control_link, linkText), bus.control_link === 'Lost' ? 'warn' : undefined);
        metric(metrics, `输出模式${old}`, valueText(bus.output_mode, outputText));
        metric(metrics, `故障码${old}`, Number.isInteger(bus.fault_code) ? String(bus.fault_code) : '未知', bus.fault_code > 0 ? 'bad' : undefined);
        metric(metrics, '位置数据年龄', ageText(age));
        article.append(metrics);

        let note = '';
        if (bus.error) note = String(bus.error);
        else if (!connected) note = activeSession ? '等待有效状态反馈，以下旧数据仅供参考。' : '状态流已断开，以下内容为最后一次反馈。';
        else if (status === 'stale') note = '源数据未及时推进，当前实际状态未确认。';
        else if (status === 'unavailable') note = '尚无有效状态样本，不能判断设备是否上扭。';
        else if (status === 'invalid') note = '状态身份、布局或数据校验未通过。';
        else if (bus.safety_state === 'AdapterUncertain' || bus.safety_state === 'TorqueUnknown') note = '数据正在更新，但电机扭矩状态仍未确认。';
        if (status !== 'fresh' && hasReportedState) note += ' 软件与保护状态为最后报告，不代表已有新鲜位置或确认当前扭矩。';
        if (note) {
          const detail = node('p', 'state-note', note);
          detail.dataset.tone = status === 'invalid' ? 'bad' : status !== 'fresh' || bus.safety_state === 'AdapterUncertain' || bus.safety_state === 'TorqueUnknown' ? 'warn' : 'neutral';
          article.append(detail);
        }

        const wrap = node('div', 'table-wrap');
        const table = node('table');
        table.setAttribute('aria-label', `${bus.label || bus.id}关节位置`);
        const head = node('thead');
        const headRow = node('tr');
        for (const title of ['关节', 'ID', '模式', status === 'fresh' ? '位置' : '最后位置']) headRow.append(node('th', '', title));
        head.append(headRow);
        const body = node('tbody');
        for (const joint of bus.joints) {
          const row = node('tr');
          const name = node('td');
          name.append(node('span', 'joint-name', jointLabel(joint.name)), node('span', 'joint-key', joint.name));
          const mode = joint.mode === 'position' ? '位置' : joint.mode === 'velocity_raw' ? '原始速度' : '未知';
          const position = node('td', 'position');
          if (joint.mode === 'position' && Number.isFinite(joint.position_rad)) {
            position.append(node('span', '', `${joint.position_rad.toFixed(3)} rad`), node('small', '', `${(joint.position_rad * 180 / Math.PI).toFixed(1)}°`));
          } else {
            position.append(node('span', '', '—'));
            if (joint.mode === 'velocity_raw') position.append(node('small', '', '速度模式'));
          }
          row.append(name, node('td', 'motor-id', String(joint.motor_id)), node('td', '', mode), position);
          body.append(row);
        }
        table.append(head, body);
        wrap.append(table);
        article.append(wrap, node('div', 'bus-foot', `${bus.hardware_id} · 布局 ${bus.layout_id}`));
        return article;
      }
      function render() {
        if (!snapshot) return;
        const fragment = document.createDocumentFragment();
        for (const bus of snapshot.buses) fragment.append(renderBus(bus));
        elements.buses.replaceChildren(fragment);
        const joints = snapshot.buses.reduce((count, bus) => count + bus.joints.length, 0);
        const fresh = snapshot.buses.filter(bus => statusOf(bus) === 'fresh').length;
        elements.summary.textContent = `${snapshot.buses.length} 条总线 · ${joints} 个电机 · ${fresh} 条反馈新鲜`;
      }
      function receiveSnapshot(value) {
        if (!value || !Array.isArray(value.buses) || value.buses.length > 2 || !Number.isFinite(value.stale_after_ms) || value.stale_after_ms <= 0) throw new Error('状态数据格式无效。');
        for (const bus of value.buses) {
          if (!bus || typeof bus.id !== 'string' || typeof bus.robot_id !== 'string' || typeof bus.hardware_id !== 'string' || typeof bus.layout_id !== 'string' || !Array.isArray(bus.joints) || bus.joints.length > 256) throw new Error('总线数据格式无效。');
          if (bus.joints.some(joint => !joint || typeof joint.name !== 'string' || !Number.isInteger(joint.motor_id))) throw new Error('关节数据格式无效。');
        }
        for (const bus of value.buses) {
          const previous = snapshot?.buses.find(old => old.id === bus.id && old.robot_id === bus.robot_id && old.hardware_id === bus.hardware_id && old.layout_id === bus.layout_id);
          const previousAge = previous ? ageOf(previous) : null;
          if (previous && bus.stamp_ns !== null && bus.stamp_ns === previous.stamp_ns && previousAge !== null && Number.isFinite(bus.age_ms) && bus.age_ms >= 0) {
            bus.age_ms = Math.max(bus.age_ms, previousAge);
          }
        }
        snapshot = value;
        receivedAt = performance.now();
      }
      function closeSession() {
        const previous = activeSession;
        activeSession = null;
        connected = false;
        if (previous && previous.socket.readyState < WebSocket.CLOSING) {
          previous.socket.close(1000, '停止查看');
        }
        elements.connect.disabled = false;
        elements.disconnect.disabled = true;
        render();
      }
      function failSession(session, message) {
        if (activeSession !== session) return;
        closeSession();
        setConnection('连接已中断', 'bad');
        elements.notice.textContent = message;
      }
      elements.connect.addEventListener('click', () => {
        closeSession();
        elements.notice.textContent = '';
        elements.connect.disabled = true;
        elements.disconnect.disabled = false;
        setConnection('正在连接状态服务', 'warn');
        try {
          const url = new URL('/api/ws', window.location.href);
          url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
          const session = { socket: new WebSocket(url) };
          activeSession = session;
          session.socket.onopen = () => {
            if (activeSession !== session) return;
            setConnection('已连接，等待状态数据', 'warn');
          };
          session.socket.onmessage = event => {
            if (activeSession !== session) return;
            try {
              if (typeof event.data !== 'string') throw new Error('状态服务返回了非文本数据。');
              if (event.data.length > 524288) throw new Error('状态数据超出页面容量。');
              receiveSnapshot(JSON.parse(event.data));
              connected = true;
              setConnection('状态流已连接', 'good');
              render();
            } catch (error) {
              failSession(session, error instanceof SyntaxError ? '状态服务返回了无效数据，请重新连接。' : error.message || '状态数据无效。');
            }
          };
          session.socket.onerror = () => failSession(session, '无法连接状态服务，请手动重新连接。');
          session.socket.onclose = () => failSession(session, '状态流已中断，请重新连接；最后反馈不能代表当前状态。');
        } catch (error) {
          closeSession();
          setConnection('连接已中断', 'bad');
          elements.notice.textContent = error.message || '无法连接状态服务。';
        }
      });
      elements.disconnect.addEventListener('click', () => {
        closeSession();
        elements.notice.textContent = '';
        setConnection('已断开查看', 'neutral');
      });
      function clearCameraImage(camera) {
        camera.image.hidden = true;
        camera.image.removeAttribute('src');
        if (camera.url) URL.revokeObjectURL(camera.url);
        if (camera.pendingUrl) URL.revokeObjectURL(camera.pendingUrl);
        camera.url = null;
        camera.pendingUrl = null;
      }
      function cameraAge(camera) {
        return camera.stamp ? camera.age + Math.max(0, performance.now() - camera.receivedAt) : null;
      }
      function renderCameraAge(camera) {
        const age = cameraAge(camera);
        const fresh = preview && !camera.error && age !== null && age <= preview.config?.stale_after_ms && camera.url;
        camera.badge.textContent = fresh ? '画面新鲜' : camera.error ? '无可用画面' : age !== null ? '画面陈旧' : '等待画面';
        camera.badge.dataset.tone = fresh ? 'good' : 'warn';
        camera.image.hidden = !fresh;
        camera.placeholder.hidden = Boolean(fresh);
        camera.placeholder.textContent = camera.error || (age !== null ? '画面已陈旧，等待新的图像。' : '等待首帧');
        camera.meta.textContent = camera.stamp ? `${camera.width} × ${camera.height} · ${ageText(age)} · 源时间 ${camera.stamp}` : '尚无有效图像';
      }
      function stopPreview(message) {
        const previous = preview;
        preview = null;
        previous?.controller.abort();
        for (const camera of cameraCards) {
          clearTimeout(camera.timer);
          camera.controller?.abort();
          clearCameraImage(camera);
          camera.error = '画面已暂停';
          renderCameraAge(camera);
        }
        elements['camera-toggle'].textContent = '查看画面';
        elements['camera-toggle'].setAttribute('aria-pressed', 'false');
        elements['camera-notice'].textContent = message;
      }
      function makeCamera(definition) {
        const article = node('article', 'camera');
        const heading = node('div', 'camera-heading');
        const badge = node('span', 'badge', '等待画面');
        badge.dataset.tone = 'warn';
        heading.append(node('h3', '', definition.label), badge);
        const frame = node('div', 'camera-frame');
        const image = node('img');
        image.alt = `${definition.label}画面`;
        image.hidden = true;
        const placeholder = node('div', 'camera-placeholder', '等待首帧');
        frame.append(image, placeholder);
        const meta = node('p', 'camera-meta', '尚无有效图像');
        article.append(heading, frame, meta);
        elements.cameras.append(article);
        return { id: definition.id, image, placeholder, badge, meta, stamp: null, age: 0, receivedAt: 0, error: null, url: null, pendingUrl: null, controller: null, timer: null };
      }
      async function readCamera(session, camera) {
        if (preview !== session) return;
        const controller = new AbortController();
        camera.controller = controller;
        const timeout = setTimeout(() => controller.abort(), 3000);
        const startedAt = performance.now();
        try {
          const response = await fetch(`/api/cameras/${encodeURIComponent(camera.id)}/frame`, { cache: 'no-store', signal: controller.signal });
          if (!response.ok) {
            let detail;
            try { detail = await response.json(); } catch (_) { /* 保留HTTP状态说明。 */ }
            throw new Error(typeof detail?.error === 'string' ? detail.error : `画面读取失败（HTTP ${response.status}）`);
          }
          const stamp = response.headers.get('X-Frame-Stamp-Ns');
          const ageHeader = response.headers.get('X-Frame-Age-Ms');
          const age = ageHeader === null || ageHeader.trim() === '' ? NaN : Number(ageHeader);
          const width = Number(response.headers.get('X-Frame-Width'));
          const height = Number(response.headers.get('X-Frame-Height'));
          if (!/^[1-9]\d*$/.test(stamp || '') || !Number.isFinite(age) || age < 0 || !Number.isInteger(width) || width < 1 || !Number.isInteger(height) || height < 1 || response.headers.get('Content-Type')?.split(';')[0].trim() !== 'image/jpeg') throw new Error('相机图像或源时间信息无效。');
          if (camera.stamp && BigInt(stamp) < BigInt(camera.stamp)) throw new Error('图像源时间回退，等待新的图像。');
          const blob = await response.blob();
          if (!blob.size || blob.size > 1048576) throw new Error('相机图像大小无效。');
          if (preview !== session) return;
          // 旧帧不续年龄；网络传输耗时也计入显示年龄。
          const downloadedAt = performance.now();
          const receivedAge = age + Math.max(0, downloadedAt - startedAt);
          const previousAge = cameraAge(camera);
          const frameAge = stamp === camera.stamp && previousAge !== null ? Math.max(receivedAge, previousAge) : receivedAge;
          if (frameAge > session.config.stale_after_ms) throw new Error('图像已陈旧，等待新的图像。');
          camera.pendingUrl = URL.createObjectURL(blob);
          const decoded = new Image();
          decoded.src = camera.pendingUrl;
          await decoded.decode();
          if (preview !== session) return;
          if (decoded.naturalWidth !== width || decoded.naturalHeight !== height) throw new Error('图像尺寸与源信息不一致。');
          if (camera.url) URL.revokeObjectURL(camera.url);
          camera.url = camera.pendingUrl;
          camera.pendingUrl = null;
          camera.image.src = camera.url;
          camera.age = frameAge + Math.max(0, performance.now() - downloadedAt);
          camera.receivedAt = performance.now();
          camera.stamp = stamp;
          camera.width = width;
          camera.height = height;
          camera.error = null;
        } catch (error) {
          if (preview !== session) return;
          camera.error = controller.signal.aborted ? '图像读取超时，等待下次更新。' : error.message || '相机暂不可用。';
          clearCameraImage(camera);
        } finally {
          clearTimeout(timeout);
          if (camera.controller === controller) camera.controller = null;
          if (preview === session) {
            renderCameraAge(camera);
            // 每路仅在本次读取结束后预约下一帧，不积压请求。
            camera.timer = setTimeout(() => readCamera(session, camera), session.config.interval_ms);
          }
        }
      }
      async function startPreview() {
        if (document.hidden) return;
        const session = { controller: new AbortController(), config: null };
        preview = session;
        elements['camera-toggle'].textContent = '暂停画面';
        elements['camera-toggle'].setAttribute('aria-pressed', 'true');
        elements['camera-notice'].textContent = '正在读取相机配置…';
        const timeout = setTimeout(() => session.controller.abort(), 3000);
        try {
          const response = await fetch('/api/cameras', { cache: 'no-store', signal: session.controller.signal });
          if (!response.ok) throw new Error(`相机配置读取失败（HTTP ${response.status}）。`);
          const config = await response.json();
          if (preview !== session) return;
          if (!config || typeof config.enabled !== 'boolean' || !Array.isArray(config.cameras) || config.cameras.length > 8 || !Number.isInteger(config.interval_ms) || config.interval_ms < 100 || config.interval_ms > 60000 || !Number.isFinite(config.stale_after_ms) || config.stale_after_ms < config.interval_ms || config.stale_after_ms > 600000) throw new Error('相机配置格式无效。');
          if (!config.enabled || !config.cameras.length) { stopPreview('服务端尚未启用相机预览。'); return; }
          const ids = new Set();
          for (const camera of config.cameras) {
            if (!camera || typeof camera.id !== 'string' || !camera.id || ids.has(camera.id) || typeof camera.label !== 'string' || !camera.label) throw new Error('相机列表格式无效。');
            ids.add(camera.id);
          }
          session.config = config;
          elements.cameras.replaceChildren();
          cameraCards = config.cameras.map(makeCamera);
          elements['camera-summary'].textContent = `${cameraCards.length} 路 · 最快每 ${(config.interval_ms / 1000).toLocaleString('zh-CN')} 秒更新`;
          elements['camera-notice'].textContent = '';
          for (const camera of cameraCards) void readCamera(session, camera);
        } catch (error) {
          if (preview === session) stopPreview(session.controller.signal.aborted ? '相机配置读取超时，请重新查看。' : error.message || '无法读取相机配置。');
        } finally {
          clearTimeout(timeout);
        }
      }
      elements['camera-toggle'].addEventListener('click', () => {
        if (preview) stopPreview('画面已暂停；点击“查看画面”继续。');
        else void startPreview();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && preview) stopPreview('页面已切到后台，画面暂停；返回后可重新查看。');
      });
      // 仅推进展示年龄，不把页面计时或重复收包当成新的设备采样。
      const ageTimer = setInterval(() => { render(); for (const camera of cameraCards) renderCameraAge(camera); }, 500);
      window.addEventListener('pagehide', () => { clearInterval(ageTimer); closeSession(); stopPreview('画面已暂停。'); });
    })();
  </script>
</body>
</html>
