[package]
name         = "robot-adapter-feetech"
description  = "Feetech STS3215 / SMS / SCS 系列 servo adapter（Rust 自实现 wire protocol）"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

# v0.2 task 27 范围说明（详 src/lib.rs module-level docs）：
# - 本 crate **只**提供 Feetech wire protocol + ManipulatorAdapter 实现 + mock
#   transport 单测；**不**带 `serialport` 依赖，不能直接驱动真硬件。
# - task 28 真机阶段加 `feature = "real-hw"`，把 `serialport` link 进来。
# 依赖白名单登记见 docs/CHANGELOG.md 2026-04-24 "Step 7 task 27 robot-adapter-feetech"。

[dependencies]
robot-core = { workspace = true }
# task-32 (2026-04-25)：robot-logging 只在 feetech_poke example (bin) 里用，
# library 自身只用 tracing macros；dev-dep 可能更干净，但 example 编译也要求
# 主 crate 能 link —— 干脆放 dep 里 + optional real-hw gate。
robot-logging = { workspace = true, optional = true }
thiserror  = { workspace = true }
inventory  = { workspace = true }
# task-32：library 代码用 tracing macros 生产结构化 Event，subscriber init
# 由 binary 负责（不依赖 robot-logging）。
tracing    = { workspace = true }
# Step 7 task 28：real-hw feature 拉 serialport，提供 RealSerialTransport +
# 注册 FeetechFactory（task 28 真机阶段必需；CI / dev 默认 off 走 mock）。
serialport = { workspace = true, optional = true }
# Step 7 task 29 (2026-04-25)：MotorCalibration JSON loader，格式与 dimos
# scripts/calibrate.py 输出 1:1 兼容。纯 deserialize + try_from 校验，不写
# EEPROM（EEPROM 写仍走 calibration::write_calibration / set_half_turn_homings
# 这条路，调用方自己控制）。白名单登记 docs/CHANGELOG.md 2026-04-25。
serde      = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# 启用 real-hw 后：
# - `transport::real::RealSerialTransport` 可用
# - `factory::FeetechFactory` 自注册（adapter name = "feetech_sts3215"）
# 详 docs/CHANGELOG.md 2026-04-24 "Step 7 task 28 feetech real-hw + Orin 实跑"。
real-hw = ["dep:serialport", "dep:robot-logging"]

[dev-dependencies]
# Step 7 task 27c：criterion bench harness（5 组：sign-magnitude / LE byte /
# protocol packet / parse_status / bus end-to-end）。
criterion = { workspace = true }
# Step 7 task 29：calibration_io 单测用 NamedTempFile 写 JSON fixture。
tempfile  = { workspace = true }
# task-30 v9 / M4：safety_stop_fast / sync_write_by_id_into 路径 zero-alloc
# 单测包裹（与 robot-adapter-mock 同款）。
assert_no_alloc = { workspace = true }

[[bench]]
name = "feetech_bench"
harness = false # criterion 自带 harness，不用 default test runner

# Step 7 task 29 follow-up：bring-up / 下使能 / 单寄存器诊断的裸 wire 工具。
# required-features = ["real-hw"] 保证 mock-only 编译路径不拉 serialport。
[[example]]
name              = "feetech_poke"
required-features = ["real-hw"]

[lints]
workspace = true
