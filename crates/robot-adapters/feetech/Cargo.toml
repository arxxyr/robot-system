[package]
name         = "robot-adapter-feetech"
description  = "Feetech STS3215 / SMS / SCS 系列 servo adapter（Rust 自实现 wire protocol）"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

# v0.2 task 27 范围说明（详 src/lib.rs module-level docs）：
# - 本 crate **只**提供 Feetech wire protocol + ManipulatorAdapter 实现 + mock
#   transport 单测；**不**带 `serialport` 依赖，不能直接驱动真硬件。
# - task 28 真机阶段加 `feature = "real-hw"`，把 `serialport` link 进来。
# 依赖白名单登记见 docs/CHANGELOG.md 2026-04-24 "Step 7 task 27 robot-adapter-feetech"。

[dependencies]
robot-core = { workspace = true }
thiserror  = { workspace = true }
inventory  = { workspace = true }
# Step 7 task 28：real-hw feature 拉 serialport，提供 RealSerialTransport +
# 注册 FeetechFactory（task 28 真机阶段必需；CI / dev 默认 off 走 mock）。
serialport = { workspace = true, optional = true }

[features]
default = []
# 启用 real-hw 后：
# - `transport::real::RealSerialTransport` 可用
# - `factory::FeetechFactory` 自注册（adapter name = "feetech_sts3215"）
# 详 docs/CHANGELOG.md 2026-04-24 "Step 7 task 28 feetech real-hw + Orin 实跑"。
real-hw = ["dep:serialport"]

[dev-dependencies]
# Step 7 task 27c：criterion bench harness（5 组：sign-magnitude / LE byte /
# protocol packet / parse_status / bus end-to-end）。
criterion = { workspace = true }

[[bench]]
name = "feetech_bench"
harness = false # criterion 自带 harness，不用 default test runner

[lints]
workspace = true
