[package]
name        = "robot-tests"
description = "集成示例 + soak / crash-restart / schema_compat 测试套（v0.2+）。"
version    .workspace = true
edition    .workspace = true
license    .workspace = true
authors    .workspace = true
repository .workspace = true
readme     .workspace = true
publish    .workspace = true

# Step 5 bin：同进程 pub/sub 示例，打印 3 条 JointState。
# 后续（Step 7+）会加 crash_restart / schema_compat / soak bin。

[[bin]]
name = "hello_pubsub"
path = "src/bin/hello_pubsub.rs"

[[bin]]
name = "iceoryx2_rt_baseline"
path = "src/bin/iceoryx2_rt_baseline.rs"

# Step 9 EStop latch crash/restart 测试套（task #15 后续 v0.2 收尾）。
# spawn s0_daemon + mock_s1 + robotctl 真子进程，SIGKILL daemon 后验证 latch
# 一致性。详 docs/handoffs/2026-04-26_3.md §5 + 本文件注释。
[[bin]]
name = "crash_restart_smoke"
path = "src/bin/crash_restart_smoke.rs"

# v0.3 A2-3 systemd e2e test —— freeze ipc_thread 5s → systemd WatchdogSec
# timeout → Restart=on-failure 拉起新 daemon → 5/5 round PASS。详
# docs/handoffs/v0.3_entry.md §4.4 + scripts/systemd/xlerobot-s0-freeze-test.service。
#
# `required-features` 守门：本 bin 需要 `freeze-systemd-smoke` feature（启用
# `robot-s0` optional dep + 它的 `test-freeze-hook` feature），生产构建（如
# `cargo build -p robot-tests --release`）默认 feature 关，本 bin 不参编译。
[[bin]]
name = "freeze_systemd_smoke"
path = "src/bin/freeze_systemd_smoke.rs"
required-features = ["freeze-systemd-smoke"]

# v0.3 A1-3 (3/3) ClearEStop control plane 端到端 smoke binary。
#
# 起两进程（`s0_daemon` + `robot_rpc_gateway`）+ 用 tonic gRPC client 真跑
# RPC → iceoryx2 RR shm → daemon ipc_thread → clear_estop_action → latch
# fsync 双写。
#
# `required-features = ["clear-estop-e2e"]`：本 bin 用 robot-rpc 的 `client`
# feature 跑 tonic-build 生成 client stub，再加 tokio + tonic 等 smoke-only
# deps。生产 release 构建默认 feature 关，本 bin 不参编译，跟
# `freeze_systemd_smoke` 同款 feature 守门。
[[bin]]
name = "clear_estop_e2e"
path = "src/bin/clear_estop_e2e.rs"
required-features = ["clear-estop-e2e"]

# v0.4 候选 3 (1/2) pubsub cleanup smoke binary。
#
# 起两进程（`s1_daemon` + `robot_rpc_gateway`）+ tonic gRPC client 真跑
# task control plane RPC (InvokeTask / StreamTaskEvents) → iceoryx2 RR
# shm → s1 coordinator → per-ActionId pubsub topic → gateway subscribe
# → client。AC-A1/A2/A3 实测套件（长跑 + grace + leftover）留 (2/2)。
#
# `required-features = ["pubsub-cleanup-smoke"]`：跟 `clear-estop-e2e`
# 同款 feature 守门 —— 生产 release 默认 feature 关，本 bin 不参编译。
# 复用 robot-rpc/client + tonic + tokio(process,io-util) 三条 optional
# dep，跟 clear-estop-e2e feature 完全等价（仅 feature 名 + binary 名
# 不同）。
[[bin]]
name = "pubsub_cleanup_smoke"
path = "src/bin/pubsub_cleanup_smoke.rs"
required-features = ["pubsub-cleanup-smoke"]

# v0.4 候选 1 (3/3) ScriptedBackend cross-process e2e smoke binary。
#
# 起两进程（s1_daemon + robot_rpc_gateway）+ tonic gRPC client 真跑
# InvokeTask(kind=Scripted, payload=ScriptedPayload) → iceoryx2 RR shm
# → s1 coordinator → ScriptedBackend.tick() 50Hz → JointCommand
# publish → gateway StreamTaskEvents 收 Started/Progress/终态。覆盖
# AC-4 happy multi-waypoint / AC-5 source_task_id 跨 segment 严格单调
# / AC-6 cancel mid stream 终态 = Cancelled only / AC-7 payload boundary
# 四子 case。详 team-swe/specs/v0_4_scripted_backend.md §Plan P.2.3 +
# AC-4..AC-7。
#
# `required-features = ["scripted-backend-smoke"]`：跟 pubsub-cleanup-
# smoke / clear-estop-e2e 同款 feature 守门 —— 生产 release 默认
# feature 关，本 bin 不参编译。复用 robot-rpc/client + tonic + tokio
# 三条 optional dep，跟其它 smoke binary 完全等价。
[[bin]]
name = "scripted_backend_smoke"
path = "src/bin/scripted_backend_smoke.rs"
required-features = ["scripted-backend-smoke"]

# v0.4 候选 2 round 2 (4/4) IkBackend cross-process smoke。
# `required-features = ["ik-backend-smoke"]`：跟 scripted-backend-smoke
# 同款 feature 守门 —— 生产 release 默认 feature 关，本 bin 不参编译。
# 复用 robot-rpc/client + tonic + tokio 三条 optional dep + 新增
# robot-kinematics / robot-kinematics-xlerobot 两条 optional dep（仅本
# bin 用，用作 IkPayload builder 时 cross-check / selftest solver
# round-trip）。**不**抽公共 helper（reviewer 拍板"smoke 不把 helper
# 抽公共库"），inline 同款 scripted_backend_smoke 模式。
[[bin]]
name = "ik_backend_smoke"
path = "src/bin/ik_backend_smoke.rs"
required-features = ["ik-backend-smoke"]

# v0.5 候选 A (5/5) robotctl operator CLI cross-process e2e smoke。
# 起 gateway + s1_daemon + FakeStatePublisher（fake s0），**唯一被测路径 =
# spawn `robotctl` 真子进程**（reviewer 审查重点 3：严禁 smoke 内调 tonic
# client）。**不显式启用 `robot-rpc/client`、也不直接启用 `dep:tonic`**：独立
# feature 构建不生成 `RobotControlClient`，源码不调用 tonic client；**但
# `dep:robot-rpc` 的普通依赖本身会编译 tonic server 栈**（`cargo tree` 实证），
# 合并 feature 构建亦可能经 feature unification 生成 client——边界由**单
# feature gate + 源码纪律**共同锁定（段(8) round 2 事实更正，PX-19）。依赖面 =
# tokio（process/io-util/net 协调子进程 + TCP readiness）+ 既有 iceoryx2 /
# robot-msg / robot-transport（FakeStatePublisher + EStop 订阅验证）+ robot-rpc
# **仅**取 `client::layout` 派生 layout（段(4) 起；候选 A "零 robot-rpc 依赖"
# 表述作废）；readiness 走 TCP connect +
# s1 stderr marker + robotctl get-task-status NotFound 探针（不走 tonic）。
# `required-features = ["robotctl-smoke"]` 守门，生产 release 不参编译。
[[bin]]
name = "robotctl_smoke"
path = "src/bin/robotctl_smoke.rs"
required-features = ["robotctl-smoke"]

# v0.5 候选 E 段(8) S1 / gateway systemd watchdog 双向 e2e smoke（Spec P.2.7 +
# AC-E19 + R5-5 / R6-5）。起 user-mode systemd unit（Type=notify +
# WatchdogSec=2s + Restart=on-failure）→ 经 test-only freeze topic（S1
# `/<robot_id>/s1/test/freeze` / gateway `/<robot_id>/gateway/test/freeze`）
# 逐类 worker 注入 freeze → withholding → 真重启 PID 切换 → 反向步（PID0
# 定向命令 → PID1 stale-ignored 且无二次 withholding）→ 空闲 ≥ 3 ×
# WatchdogSec 不重启。S1 case 进程内起 FakeStatePublisher；gateway case 双
# hardware config 冻 StatePool(1) 单线程。
#
# `required-features = ["sd-watchdog-smoke"]` 守门：启用 robot-s1（path +
# default-features=false + test-freeze-hook）与 robot-rpc（含其
# test-freeze-hook）两条 optional dep，只为 import 两侧 cfg-gated wire struct
# （`TestFreezeCommandV2` / `WorkerKind`，单源沿 freeze_systemd_smoke 先例）。
[[bin]]
name = "sd_watchdog_smoke"
path = "src/bin/sd_watchdog_smoke.rs"
required-features = ["sd-watchdog-smoke"]

# v0.5 候选 E 段(10-demo)：真机受监督 demo 验收 bin（Spec D10 拍板 (c)）。
# phase 化：read-state → single-arm → dual-arm → grippers → 汇总；上扭
# phase 硬性要求 --ack-safety-checklist（AC-E12 安全边界五条）。
[[bin]]
name = "supervised_demo"
path = "src/bin/supervised_demo.rs"
required-features = ["supervised-demo"]

# post-E 独立验收工具；默认构建不编译注入与现场测量入口。
[[bin]]
name = "comm_fault_e2e"
path = "src/bin/comm_fault_e2e.rs"
required-features = ["comm-fault-e2e"]

[dependencies]
blake3 = { workspace = true, optional = true }
# iceoryx2 集成路径走默认 feature；若未来单独测 mock 路径可开 --no-default-features。
flatbuffers     = { workspace = true }
# v0.5 候选 E 段(2) 回修 P0-1：lib config_fixture 结构化重写 [robot].id
# （身份锁下六 harness 的"静态 config + 动态 robot_id"消费面；新依赖边
# robot-tests → toml，timings/tree/deny 随段跑）。
toml            = { workspace = true }
iceoryx2        = { workspace = true }
iceoryx2-bb-posix = { workspace = true, optional = true }
robot-core      = { workspace = true }
robot-msg       = { workspace = true }
robot-transport = { workspace = true, default-features = true }
hdrhistogram    = { workspace = true }
# task-32 (2026-04-25) 日志骨架：crash_restart_smoke binary 走 robot-logging
# 自动 init（其它 bin 同款，统一字段表 + JSON/human 双模式）。
robot-logging   = { workspace = true }
tracing         = { workspace = true }
# Step 9 crash_restart_smoke：libc::kill(pid, SIGKILL) 直接发 kill -9，
# 模拟最严格的"无 signal handler 机会"故障模型（systemd OOM kill 同款）。
libc            = { workspace = true }

# 根依赖关闭 S0/S1 默认 features；本包仅在显式 smoke feature 下启用这些依赖。
# S0 使用 mock；测试 hook 沿下方各 smoke feature 的既有转发开启，不进入生产默认图。
robot-s0 = { workspace = true, optional = true, features = ["mock-only"] }
robot-s1 = { workspace = true, optional = true, features = ["test-freeze-hook"] }

# v0.3 A1-3 (3/3-a) clear_estop_e2e optional deps（feature-gated）：
# - robot-rpc：**不**在依赖声明上全局挂 `client` feature（段(8) round 2 PX-19
#   修正）——真用 tonic client 的 smoke feature 各自显式 `"robot-rpc/client"`
#   （让 build.rs 跑 `tonic_build::build_client(true)` 生成 `RobotControlClient`
#   stub）；`robotctl-smoke` / `sd-watchdog-smoke` 只 `dep:robot-rpc` 不开
#   client——**单 feature 构建**不生成 `RobotControlClient`（合并 feature 构建
#   仍可能经 unification 生成；tonic server 栈则随 robot-rpc 普通依赖必编，
#   段(8) round 2 事实更正）。
# - tonic：跑 client transport stack；client 端只需 transport，**不**需
#   server。覆盖 features 跟 workspace 默认对齐。
# - tokio：smoke 主 entry 用 `#[tokio::main]` 跑 tonic client + 子进程协调；
#   workspace 默认 features 已含 macros / rt-multi-thread / signal / sync
#   / time / net；本 bin 加 `process` 让 `tokio::process::{Command, Child}`
#   + `tokio::time::timeout` 协调子进程退出，加 `io-util` 让 stderr 流式
#   read 等 ready signal。
# - flatbuffers / robot-msg / robot-core：复用顶层 deps，不重复声明。
# - **不**用 tempfile workspace dep：workspace 顶层注释明示 tempfile 仅在
#   dev-dependencies 位置继承；clear_estop_e2e 是 binary 不能 link dev-deps，
#   tempdir 自己滚（`/tmp/clear_estop_e2e_<pid>_<seq>`，shutdown
#   `remove_dir_all`），减少 workspace dep surface。
robot-rpc = { workspace = true, optional = true }
tonic     = { workspace = true, optional = true }
tokio     = { workspace = true, optional = true, features = ["process", "io-util"] }

# v0.5 候选 A (5/5) robotctl_smoke optional dep：json_output_round_trip phase
# 真 parse robotctl `--json` stdout（AC-7）。**仅** robotctl-smoke feature 用。
serde_json = { workspace = true, optional = true }

# v0.4 候选 2 round 2 (4/4) ik_backend_smoke optional deps：
# - robot-kinematics：trait crate（ArmIkSolver / Pose / IkError 等共享
#   类型）。selftest 期跟 binary 端构造 XLeRobotArmIkSolver 算 expected
#   joints（用作 ground truth 比对）；同时验"IkPayload builder bytes
#   能让 trait 层 root::<IkPayload> verify 通过"路径。
# - robot-kinematics-xlerobot：impl crate（XLeRobotArmIkSolver）。
#   smoke 端构造一个 Side::Right solver 实例（**不** spawn 进 daemon ——
#   daemon 已自带；这里仅是 ground truth）。
# - **optional + ik-backend-smoke feature gate**：生产 release 不带本
#   feature → robot-kinematics / robot-kinematics-xlerobot 都不 link
#   进 robot-tests crate。
robot-kinematics          = { workspace = true, optional = true }
robot-kinematics-xlerobot = { workspace = true, optional = true }
# v0.5 候选 E 段(6)（Spec D11 换算权威唯一 + P.2.6）：feetech 公共换算 API
# （`raw_to_rad` / `rad_to_raw`）供段(9) preflight / 真机验收 bin 从标定 JSON
# `range_min/max` 派生 gripper rad_lo/rad_hi，再传 `robot_rpc::client::
# baseline_shim`。当前由 comm-fault-e2e 显式启用，软件门也消费真实编码与记录器；
# real-hw 仅弱转发串口 feature，不单独拉入无人消费的依赖或启用验收 binary。
robot-adapter-feetech = { workspace = true, optional = true }

[features]
# 跨平台 RPC 收尾共享模块及显式 loopback 回归，不启用 Linux 验收 binary。
comm-fault-rpc = [
    "dep:robot-rpc",
    "robot-rpc/client",
    "dep:tokio",
    "dep:tonic",
    "dep:serde_json",
]
# 独立启用真实验收依赖，不继承旧 freeze hook；现场串口仍需另外启用 real-hw。
comm-fault-e2e = [
    "comm-fault-rpc",
    "dep:blake3",
    "dep:robot-s0",
    "robot-s0/test-comm-fault-hook",
    "robot-s0/mock",
    "robot-s0/feetech",
    "dep:robot-adapter-feetech",
]
# v0.3 A2-3 freeze systemd smoke 入口 feature。
# - 生产 release **不**带本 feature（freeze_systemd_smoke binary 不参编译）。
# - 本机跑：`cargo run -p robot-tests --bin freeze_systemd_smoke --features
#   freeze-systemd-smoke -- ...`
# - reviewer 硬边界：本 feature 同时启用 robot-s0 optional dep + 它的
#   `test-freeze-hook` feature，让 smoke 跟 daemon binary 共享 wire struct。
freeze-systemd-smoke = ["dep:robot-s0", "robot-s0/test-freeze-hook"]

# v0.3 A1-3 (3/3-a) ClearEStop 端到端 smoke 入口 feature。
# - 生产 release **不**带本 feature（clear_estop_e2e binary 不参编译）。
# - 本机跑：`cargo run -p robot-tests --bin clear_estop_e2e --features
#   clear-estop-e2e -- ...`
# - 启用 robot-rpc / tonic / tokio 3 条 optional dep，跟
#   `freeze-systemd-smoke` 同款 feature 守门。
clear-estop-e2e = [
    "dep:robot-rpc",
    "robot-rpc/client",
    "dep:tonic",
    "dep:tokio",
]

# v0.4 候选 3 (1/2) pubsub cleanup smoke 入口 feature。
# - 生产 release 不带本 feature（pubsub_cleanup_smoke binary 不参编译）。
# - 本机跑：cargo run -p robot-tests --bin pubsub_cleanup_smoke
#   --features pubsub-cleanup-smoke -- ...
# - 启用 robot-rpc / tonic / tokio 3 条 optional dep（跟 clear-estop-e2e
#   完全等价 —— 同款 feature gate 模式）。
pubsub-cleanup-smoke = [
    "dep:iceoryx2-bb-posix",
    "dep:robot-rpc",
    "robot-rpc/client",
    "dep:tonic",
    "dep:tokio",
]

# v0.4 候选 1 (3/3) Scripted backend cross-process smoke 入口 feature。
# - 生产 release 不带本 feature（scripted_backend_smoke binary 不参编译）。
# - 本机跑：cargo run -p robot-tests --bin scripted_backend_smoke
#   --features scripted-backend-smoke -- --phase all ...
# - 启用 robot-rpc / tonic / tokio 3 条 optional dep（跟 clear-estop-e2e
#   / pubsub-cleanup-smoke 完全等价 —— 同款 feature gate 模式）。
scripted-backend-smoke = [
    "dep:robot-rpc",
    "robot-rpc/client",
    "dep:tonic",
    "dep:tokio",
]

# v0.4 候选 2 round 2 (4/4) IkBackend cross-process smoke 入口 feature。
# - 生产 release 不带本 feature（ik_backend_smoke binary 不参编译）。
# - 本机跑：cargo run -p robot-tests --bin ik_backend_smoke
#   --features ik-backend-smoke -- --phase all ...
# - 启用 robot-rpc / tonic / tokio（跟其它 smoke 同款）+ robot-kinematics /
#   robot-kinematics-xlerobot（selftest ground truth solver）。
ik-backend-smoke = [
    "dep:robot-rpc",
    "robot-rpc/client",
    "dep:tonic",
    "dep:tokio",
    "dep:robot-kinematics",
    "dep:robot-kinematics-xlerobot",
]

# v0.5 候选 A (5/5) robotctl operator CLI cross-process e2e smoke 入口 feature。
# - 生产 release 不带本 feature（robotctl_smoke binary 不参编译）。
# - 本机跑：cargo run -p robot-tests --bin robotctl_smoke
#   --features robotctl-smoke -- --phase all --bin-dir target/debug ...
# - 启用 tokio（process/io-util/net + workspace 默认）+ `dep:robot-rpc`（仅
#   `client::layout` 派生 layout，段(4) 起）；**不显式启用 `robot-rpc/client`、
#   也不直接启用 `dep:tonic`** —— 单 feature 构建不生成 `RobotControlClient`，
#   源码不调用 tonic client（审查重点 3 = 单 feature gate + 源码纪律共同锁定；
#   tonic server 栈随 robot-rpc 普通依赖必编，合并 feature 构建可能经
#   unification 生成 client，段(8) round 2 事实更正）。段(8) round 2 PX-19：
#   此前 feature 表漏 `dep:robot-rpc`，单 feature 构建 E0433，被 gate 的合并
#   feature 集掩蔽。
# - 加 serde_json：json_output_round_trip phase 真 parse robotctl `--json`
#   stdout（AC-7：serde_json::from_str 过 + 字段集）。serde_json 已在 lock
#   （robot-cli 用），加 optional dep 不改 Cargo.lock。
robotctl-smoke = ["dep:tokio", "dep:serde_json", "dep:robot-rpc"]
# v0.5 候选 E 段(6)：真机侧 feature（段(9) preflight / 验收 bin 的 required-
# features 宿主）——仅为已经启用的 feetech 依赖打开 `real-hw`（serialport 真串口）。
# CI / dev 默认 off；`cargo clippy -p robot-tests --all-features` 永久 gate
# （PX-5）覆盖本 feature 编译面。
# v0.5 候选 E 段(8) sd_watchdog_smoke 入口 feature（Spec P.2.7 锁名）。
# - 生产 release 不带本 feature（sd_watchdog_smoke binary 不参编译）。
# - 本机跑：先 `cargo build --release -p robot-s1 --features test-freeze-hook`
#   + `cargo build --release -p robot-rpc --features test-freeze-hook`，再
#   `cargo run -p robot-tests --bin sd_watchdog_smoke --features
#   sd-watchdog-smoke -- --s1-bin target/release/s1_daemon --gateway-bin
#   target/release/robot_rpc_gateway --phase all`。
# - `robot-rpc/test-freeze-hook` 仅在本 feature 启用，不污染 clear-estop-e2e
#   等其它 feature 的构建面；**不**开 `robot-rpc/client`（smoke 只 import
#   freeze_control wire struct）；与其它 feature 合并构建时 additive 无害。
sd-watchdog-smoke = [
    "dep:robot-s1",
    "dep:robot-rpc",
    "robot-rpc/test-freeze-hook",
]
# v0.5 候选 E 段(10-demo) supervised_demo 入口 feature（D10 (c)）。
# - 生产 release 不带本 feature（bin 不参编译）；真机跑法见
#   scripts/systemd/README_dimos_replace.md 与 Spec P.2.10。
# - `robot-rpc/client` 生成 tonic RobotControlClient（GetState / SetEnabled /
#   InvokeTask / EStop 全走 gateway loopback）；协议语义单源消费
#   `client::dual_arm_workflow`，端点适配为本 bin 内纯 I/O 第二份（PX-12
#   同款并存先例）。
supervised-demo = ["dep:tokio", "dep:tonic", "dep:robot-rpc", "robot-rpc/client"]
real-hw = ["robot-adapter-feetech?/real-hw"]

[lints]
workspace = true

[dev-dependencies]
# R4c manager的原命令/launcher单测临时目录；不进入实际验收binary依赖。
tempfile = { workspace = true }

# 真实 loopback 传输回归由 --ignored 显式运行，不混作纯单测。
[[test]]
name = "final_stop_transport"
path = "tests/final_stop_transport.rs"
required-features = ["comm-fault-rpc"]
