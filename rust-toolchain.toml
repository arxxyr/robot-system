# Rust 工具链 pin。
# 决定：nightly 硬要求（docs/00_design.md §9 / docs/CHANGELOG.md 2026-04-21）。严格不用 stable。
# 约束：核心 crate（robot-core / robot-msg / robot-transport / robot-s0 / robot-s1）
#       默认不写 `#![feature(...)]` —— 目的是降低 nightly 升级回归风险，不是留 stable 后门。
#       确需启用时在 crate 顶部注释列出。

[toolchain]
# **2026-06-09 原地回滚 pin**（CLAUDE.md 处方：pin 具体日期 + 回滚上一已验证日期）：
# nightly 2026-06-09（rustc 1.98.0-nightly beae78130）下 iceoryx2 0.8.1 编译失败
# （iceoryx2-bb-container `StaticString<256>` 无 `as_str`，E0599；上游 dep 不可改）。
# pin 上一已验证 nightly-2026-06-08（rustc f20a92ec0 2026-06-07）全 workspace 绿。
# 解除条件：iceoryx2 升级适配新 nightly 后复核回 channel = "nightly"。
channel    = "nightly-2026-06-08"
components = ["rustfmt", "clippy"]
profile    = "minimal"
# targets 留空：开发机编译 host target 即可；Orin 部署时由 scripts/deploy.sh 追加
# `rustup target add aarch64-unknown-linux-gnu`。
