# Rust 工具链 pin。
# 决定：nightly 硬要求（docs/00_design.md §9 / docs/CHANGELOG.md 2026-04-21）。严格不用 stable。
# 约束：核心 crate（robot-core / robot-msg / robot-transport / robot-s0 / robot-s1）
#       默认不写 `#![feature(...)]` —— 目的是降低 nightly 升级回归风险，不是留 stable 后门。
#       确需启用时在 crate 顶部注释列出。

[toolchain]
# **浮动最新 nightly，不锁定日期**（reviewer 2026-07-13 指令）。
# 历史：2026-06-09 nightly 下 iceoryx2 0.8.1 编译失败（E0599）曾原地回滚
# pin nightly-2026-06-08；2026-07-12 升 iceoryx2 0.9.3 后解除
# （CHANGELOG 2026-07-12 条"解除 1"）。
# 处方：nightly 滚动带来的新 clippy lint 就地 fix-forward（如 f54e19e）；
# pin 具体日期仅留给真编译破坏（CLAUDE.md §Rust 规范逃生舱，用后必须
# 登记解除条件）。
channel    = "nightly"
components = ["rustfmt", "clippy"]
profile    = "minimal"
# targets 留空：开发机编译 host target 即可；Orin 部署时由 scripts/deploy.sh 追加
# `rustup target add aarch64-unknown-linux-gnu`。
