# robot-system workspace 根
#
# 设计版本：v0.1.2（冻结，见 docs/00_design.md）
# 当前完成边界与下一步：docs/s0_hal_status.md
# 工具链：nightly 硬要求，严格不用 stable（docs/00_design.md §9 / docs/CHANGELOG.md 2026-04-21）

[workspace]
resolver = "2"
members = [
    "crates/robot-adapters/feetech",
    "crates/robot-adapters/mock",
    "crates/robot-cli",
    "crates/robot-core",
    "crates/robot-health",
    "crates/robot-kinematics",
    "crates/robot-kinematics-xlerobot",
    "crates/robot-logging",
    "crates/robot-msg",
    "crates/robot-rpc",
    "crates/robot-s0",
    "crates/robot-s1",
    "crates/robot-tests",
    "crates/robot-transport",
    "crates/robot-viz",
    "tools/rr-memory-model",
]
# 第三方补丁源码不作为自有 workspace 成员，其上游测试需要未发布的辅助包。
# 来源与本地修复见 3rd-party/ICEORYX2_VENDOR_SOURCE.md。
exclude = [
    "3rd-party/iceoryx2",
    "3rd-party/iceoryx2-cal",
    "3rd-party/re_protos",
]

[workspace.package]
version      = "0.1.2"
edition      = "2024"
# 不写 rust-version：随 nightly 自动走最新；需要复现特定日期构建时用
# rust-toolchain.toml 的 `channel = "nightly-YYYY-MM-DD"`，而非 rust-version。
license      = "Proprietary"
# 所有 crate 默认 publish=false（各子 crate 用 `publish.workspace = true` 继承）。
# cargo-deny 识别 publish=false 即跳过 license 校验（deny.toml private.ignore=true）。
publish      = false
authors      = ["loosqk <loosqk07@gmail.com>"]
repository   = "https://github.com/arxxyr/robot-system"
readme       = "README.md"

[workspace.dependencies]
# 内部模块：路径与版本在根 workspace 统一维护，子 crate 仅继承。
robot-adapter-feetech    = { path = "crates/robot-adapters/feetech" }
robot-adapter-mock       = { path = "crates/robot-adapters/mock" }
robot-core              = { path = "crates/robot-core" }
robot-health            = { path = "crates/robot-health" }
robot-kinematics        = { path = "crates/robot-kinematics" }
robot-kinematics-xlerobot = { path = "crates/robot-kinematics-xlerobot" }
robot-logging           = { path = "crates/robot-logging" }
robot-msg               = { path = "crates/robot-msg" }
robot-rpc               = { path = "crates/robot-rpc" }
robot-s0                = { path = "crates/robot-s0", default-features = false }
robot-s1                = { path = "crates/robot-s1", default-features = false }
robot-transport         = { path = "crates/robot-transport" }

# 基础类型与系统接口。
# libc 沿已批准的 1.0 预发布轨道精确锁定；升级需验证时钟与平台接口。
libc = "=1.0.0-alpha.5"
thiserror = "2.0.21"
uuid = { version = "1.29.2", default-features = false, features = ["v7", "std"] }
# rt_guard 可选运行时守卫，并非仅测试依赖；禁用默认特性以保留 release 检查。
assert_no_alloc = { version = "1.1.2", default-features = false }

# 配置与消息编码：FlatBuffers runtime 必须与 3rd-party/flatc/VERSION 一致。
blake3 = "1.8.7"
flatbuffers = "=25.12.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

# 本机通信与并发：iceoryx2 保留严格 RR 补丁；channel 用于非 RT 事件队列。
arc-swap = "1.9.5"
crossbeam-channel = "0.5.17"
iceoryx2 = "=0.10.0"

# 硬件适配：启动期工厂注册，以及 real-hw 特性启用的串口访问。
inventory = "0.3.25"
serialport = "4.10.1"

# 日志与可视化工具：日志不进入 RT；Rerun 与 mimalloc 仅供独立观测工具。
ctor = "1.0.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "ansi", "smallvec", "tracing-log"] }
mimalloc = { version = "0.1.52", default-features = false }
rerun = { version = "=0.43.0", default-features = false, features = ["sdk"] }

# 上层 RPC 与异步运行时：不进入 S0/S1 daemon 的执行路径。
prost = "0.14.4"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
# tonic 0.14 的 router 与 prost codec 需分别显式启用。
tonic = { version = "0.14.9", default-features = false, features = ["codegen", "transport", "router"] }
tonic-prost = { version = "0.14.9", default-features = false }

# 构建时代码生成：仅由 robot-rpc/build.rs 使用，不依赖系统 protoc。
protoc-bin-vendored = "3.3.0"
tonic-prost-build = { version = "0.14.9", default-features = false }

# 测试与基准工具：仅供 dev-dependencies、robot-tests 或 rr-memory-model。
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "html_reports"] }
hdrhistogram = "7.6.0"
# cleanup 测试工具解码上游 Node ID；错误映射测试命名上游载荷。
iceoryx2-bb-posix = "=0.10.0"
iceoryx2-cal = { version = "=0.10.0", default-features = false }
loom = { version = "=0.7.3", default-features = false }
# RRD 回读与 protobuf 描述符测试保持同版 Rerun。
re_log_encoding = { version = "=0.43.0", features = ["decoder"] }
re_protos = { version = "=0.43.0", default-features = false }
tempfile = "3.27.0"
trybuild = "1.0.122"

# 两个运行时 crate 保留已验证的严格 RR 本地修复，其余上游依赖由根锁文件解析。
# 升级时须迁移补丁，不能用 registry 原包直接替换。
[patch.crates-io]
iceoryx2     = { path = "3rd-party/iceoryx2" }
iceoryx2-cal = { path = "3rd-party/iceoryx2-cal" }
# 上游 re_protos 精确绑定旧 protoc；只更新其构建工具版本，协议源码保持上游原件。
re_protos = { path = "3rd-party/re_protos" }

# Workspace 级 lint 默认。
# 子 crate 在自己的 Cargo.toml 里写 `[lints] workspace = true` 即可继承。
# 注：`unsafe_op_in_unsafe_fn` 在 edition 2024 下已是默认 deny，不再在此重复声明。
[workspace.lints.cargo]
# 正式程序统一 robot- 前缀；现有测试与诊断工具保留 snake_case 名称。
# 仅允许这些工具的 Cargo 命名提示，不降低 Rust / Clippy 检查。
non_kebab_case_bins = "allow"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
# Clippy 规则按需增补；Step 0 只给一个基线，避免未来逐条开启触发大量 warning。
all          = { level = "warn", priority = -1 }
pedantic     = { level = "warn", priority = -1 }
# pedantic 里有些太吵的关掉：
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

[profile.release]
lto           = "fat"
codegen-units = 1
# panic = "abort"：S0 二进制必须 abort（docs/00_design.md §9 + §6.7 "S0 存活 = 安全充分条件"）。
# Cargo 不允许 per-package `panic` override（会报 "panic may not be specified in a package profile"），
# 所以普通 release 保持 workspace 级 abort。独立 robot-viz 使用下方
# release-tools 保留 unwind；既有控制二进制继续按原 release recipe 构建。
# 选择及适用边界见 CHANGELOG 2026-09-29 Rerun 观测桥条。
panic = "abort"

# 独立观测工具保留展开；不改变既有 S0 / S1 的 release 语义。
[profile.release-tools]
inherits = "release"
panic = "unwind"

[profile.dev]
# 开发期开 debug 断言；opt-level = 1 让 mock 500 Hz soak 不至太慢。
opt-level       = 1
debug           = true
debug-assertions = true
overflow-checks  = true

[profile.bench]
# 等价 release（lto=fat / codegen-units=1）+ 强制 debuginfo。
# 必须有 debug 信息，否则 cargo flamegraph / perf record 拿不到 symbol，
# SVG 全是 0x... 地址。开 debug 不影响代码生成（仅多写 .debug 段）。
inherits = "release"
debug    = true
