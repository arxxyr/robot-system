# robot-system workspace 根
#
# 设计版本：v0.1.2（冻结，见 docs/00_design.md）
# 实施阶段：v0.2（见 docs/01_implementation_steps.md）
# 工具链：nightly 硬要求，严格不用 stable（docs/00_design.md §9 / docs/CHANGELOG.md 2026-04-21）

[workspace]
resolver = "2"
members = [
    "crates/robot-adapters/feetech",
    "crates/robot-adapters/mock",
    "crates/robot-cli",
    "crates/robot-core",
    "crates/robot-msg",
    "crates/robot-s0",
    "crates/robot-s1",
    "crates/robot-tests",
    "crates/robot-transport",
]

# 未来 crate（按 docs/01_implementation_steps.md 顺序逐步启用；现在不要提前加入 members）：
#   crates/robot-s0                  # Step 6：四线程骨架（panic = "abort"）
#   crates/robot-s1                  # Step 6：mock_s1；v0.3 coordinator（panic = "abort"）
#   crates/robot-adapters/mock       # Step 6：mock HardRT adapter
#   crates/robot-adapters/feetech    # Step 10
#   crates/robot-kinematics          # v0.3：ArmIkSolver / BaseKinematics trait + 纯类型（零 runtime）
#   crates/robot-kinematics-xlerobot # v0.4：XLeRobot 双臂 + 三轮全向（移植 dimos kinematics/）
#   crates/robot-kinematics-piper    # v0.6：Piper 单臂（结构异构第二机器人）
#   crates/robot-policy-host         # v0.5：ExternalPolicyHost
#   crates/robot-rpc                 # v0.3：tonic 网关
#   crates/robot-s2-bridge           # v0.5：pyo3 module
#   crates/robot-viz                 # Rerun / Foxglove 桥
#   crates/robot-recorder            # record/replay
#   crates/robot-cli                 # robotctl
#   crates/robot-tests               # soak + crash/restart + schema_compat

[workspace.package]
version      = "0.1.2"
edition      = "2024"
# 不写 rust-version：随 nightly 自动走最新；需要复现特定日期构建时用
# rust-toolchain.toml 的 `channel = "nightly-YYYY-MM-DD"`，而非 rust-version。
license      = "Proprietary"
# 所有 crate 默认 publish=false（各子 crate 用 `publish.workspace = true` 继承）。
# cargo-deny 识别 publish=false 即跳过 license 校验（deny.toml private.ignore=true）。
publish      = false
authors      = ["loosqk <loosqk07@gmail.com>"]
repository   = "https://github.com/loosqk/robot-system"
readme       = "README.md"

[workspace.dependencies]
# robot-core::time (Step 1) 需要 `clock_gettime(CLOCK_MONOTONIC_RAW)` + `nanosleep`
# 的 FFI 绑定；`libc` 加入 §4.2 允许列表的登记见 docs/CHANGELOG.md 2026-04-21。
# 用户 2026-04-22 显式决定走 1.0 预发布轨道；精确 pin 防 alpha.N → alpha.N+1
# 的破坏性变更（pre-release SemVer 不保证兼容）。升级 alpha 时同步跑 time.rs 测试。
libc      = "=1.0.0-alpha.3"
# thiserror：Step 1 暂未使用（Result 路径未登场），保留入口供后续子 crate 继承。
thiserror = "2.0.18"
# robot-msg (Step 2) FlatBuffers runtime：与 3rd-party/flatc/VERSION 严格对齐（精确 pin，防 minor 漂移）。
# 白名单登记见 docs/CHANGELOG.md 2026-04-22 "workspace runtime 依赖白名单机制"。
flatbuffers = "=25.12.19"
# blake3：layout_id / ConfigIdentity / schema_lint 碰撞检测需要的固定 hash。
blake3 = "1.8.4"
# iceoryx2：本机零拷贝 pub-sub（§2.1）。精确 pin 仿 flatbuffers，防 minor 破坏性变更。
# 烟测见 docs/CHANGELOG.md 2026-04-22 "Step 5 开工决策与 iceoryx2 依赖登记"。
iceoryx2 = "=0.8.1"
# arc-swap：Step 6 Part 1 latest-command slot 的同步原语（ipc_thread → rt_thread 方向）。
# RT 侧 load() 返回 Guard 不 bump refcount（hazard pointer），满足 §4.9 RT 铁律。
arc-swap = "1.7"
# tempfile：dev-dependency，给 estop_latch / 其他涉及文件系统的单测用临时目录。
# 只在 dev-dependencies 位置继承（`tempfile = { workspace = true }` 出现在子 crate 的 dev-deps 段）。
tempfile = "3.10"
# crossbeam-channel：Step 6 Part 2 非 RT 线程间事件队列（watchdog → ipc_thread，SIGINT → ipc_thread）。
# MPMC + bounded + try_recv，零依赖无 unsafe。成熟 3.5+ SLoC 库。
crossbeam-channel = "0.5"
# hdrhistogram：Step 6 Part 2 iceoryx2_rt_baseline harness 的延迟分布统计。
# 10 µs - 10 s 动态范围，p50/p99/p999/max 精确到 3 位有效数字即可。
hdrhistogram = "7.5"
# serde + toml：Step 7 task 25 ConfigIdentity TOML loader（v0.2 阶段限 robot-s0
# 使用，robot-core 仍恪守 §4.2 零 runtime 依赖；白名单登记见 docs/CHANGELOG.md
# 2026-04-24 "Step 7 task 25 robot-s0 / robot-core::config 依赖白名单更新"）。
# toml 0.9 与 iceoryx2 0.8.1 子树对齐，避免新增重复版本（deny.toml skip-tree 注释）。
serde = { version = "1", features = ["derive"] }
toml  = "0.9"
# inventory：static 注册机制（adapter 工厂表）。Step 7 task 27b 落地。
# 链接器把每个 adapter crate 的 `submit!` 项收到一个 array section，启动期
# `iter::<&dyn AdapterFactory>()` 遍历。**零 runtime 开销**（无 alloc / 无 IO），
# 仅在进程启动一次性扫描。白名单登记见 docs/CHANGELOG.md 2026-04-24
# "Step 7 task 27b matrix + inventory adapter 自注册"。
inventory = "0.3"
# criterion：性能基准 harness。Step 7 task 27c feetech bench 落地。
# 仅在 [dev-dependencies] 用，不进任何 binary；用 default features 的
# rayon / plotters 子集，跑 cargo bench 时拉链接。
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "html_reports"] }
# serialport：跨平台串口 crate（Linux 走 libudev，需 libudev-dev / libudev1）。
# Step 7 task 28 feetech `real-hw` feature 必需；mock-only 编译路径不 link。
serialport = "4"

# 内部 crate 统一 path 依赖（workspace 继承，便于下游 crate `workspace = true`）。
robot-core          = { path = "crates/robot-core" }
robot-msg           = { path = "crates/robot-msg" }
robot-transport     = { path = "crates/robot-transport" }
robot-adapter-mock    = { path = "crates/robot-adapters/mock" }
robot-adapter-feetech = { path = "crates/robot-adapters/feetech" }
robot-s0            = { path = "crates/robot-s0" }
robot-s1            = { path = "crates/robot-s1" }
robot-cli           = { path = "crates/robot-cli" }

# Workspace 级 lint 默认。
# 子 crate 在自己的 Cargo.toml 里写 `[lints] workspace = true` 即可继承。
# 注：`unsafe_op_in_unsafe_fn` 在 edition 2024 下已是默认 deny，不再在此重复声明。
[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
# Clippy 规则按需增补；Step 0 只给一个基线，避免未来逐条开启触发大量 warning。
all          = { level = "warn", priority = -1 }
pedantic     = { level = "warn", priority = -1 }
# pedantic 里有些太吵的关掉：
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

[profile.release]
lto           = "fat"
codegen-units = 1
# panic = "abort"：S0 二进制必须 abort（docs/00_design.md §9 + §6.7 "S0 存活 = 安全充分条件"）。
# Cargo 不允许 per-package `panic` override（会报 "panic may not be specified in a package profile"），
# 所以只能设在 workspace 级别。当前 workspace 唯一的 binary 是 robot-s0，这个设置
# 正好匹配意图。Part 2 加入 robot-cli / robot-viz 等工具类 binary 后：
#   - 方案 A：给 cli 引入自定义 profile（`[profile.release-debug] inherits = "release"` +
#     `panic = "unwind"`），cli 构建用 `cargo build --profile release-debug -p robot-cli`。
#   - 方案 B：cli 保持 unwind 的代价比 S0 abort 的收益低，直接接受全局 abort。
# 到时候走 CHANGELOG 决定。
panic = "abort"

[profile.dev]
# 开发期开 debug 断言；opt-level = 1 让 mock 500 Hz soak 不至太慢。
opt-level       = 1
debug           = true
debug-assertions = true
overflow-checks  = true

[profile.bench]
# 等价 release（lto=fat / codegen-units=1）+ 强制 debuginfo。
# 必须有 debug 信息，否则 cargo flamegraph / perf record 拿不到 symbol，
# SVG 全是 0x... 地址。开 debug 不影响代码生成（仅多写 .debug 段）。
inherits = "release"
debug    = true
