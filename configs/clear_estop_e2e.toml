# v0.3 A1-3 (3/3) ClearEStop control plane 端到端 smoke 配置。
#
# 用途：`crates/robot-tests/src/bin/clear_estop_e2e.rs` 起 daemon 时
# `--config configs/clear_estop_e2e.toml` 喂入。
#
# 设计目标：
# - 单 hardware section，`mock_hard_rt` adapter（**不**碰真 serial 端口；
#   `address` / `calibration` 字段省略，mock_hard_rt 不读）。
# - joints 数量给最小可工作的值（1 joint），驱动 state machine 即可。
# - 预置 latch=true 的工作走 harness 的 `--latch-path` 文件预写，**不**在
#   本配置内表达；ClearEStop 真路径要求 `*state == Safe && safety_state ==
#   TorqueOffConfirmed`，state 由 latch=true 锁住 Safe。
#
# **不**复用 configs/xlerobot.toml：那个含 mock_omni3 base + 多 hardware
# section + sensor section，给生产仿真用；smoke 不需要那么多骨架。

[robot]
id             = "clear_estop_e2e"
config_version = "0.3.0"

[[hardware]]
id      = "smoke_arm"
adapter = "mock_hard_rt"
joints  = ["smoke_j0"]
motor_ids = [1]
