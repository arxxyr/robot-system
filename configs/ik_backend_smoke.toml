# ik_backend_smoke dev box 默认配置（v0.4 候选 2 round 2 (4/4)）。
#
# 用途：`crates/robot-tests/src/bin/ik_backend_smoke.rs` 起 daemon 时
# `--config configs/ik_backend_smoke.toml` 喂入。
#
# 跟 `configs/scripted_backend_smoke.toml` 同款 dev box mock_hard_rt
# 骨架，但 **必须** 5 joint（跟 `XLeRobotArmIkSolver.info().joint_count`
# 一致）；profile 把 `ik` backend 加进 backends，让
# `BackendRegistry::dispatch` 能匹配 `(ActionKind::Ik, SCHEMA_IK_PAYLOAD)`
# （详 `crates/robot-s1/src/action_backend/ik.rs::IkBackend::supported_*`）。
#
# `mock_dwell` / `hold_pose` 也保留：
# - mock_dwell：兼容 selftest / GetTaskStatus 探活路径（DwellMs kind
#   不被本 smoke 触发，但保留避免 startup `validate_profile_section`
#   抱怨 enabled 列表缺失）。
# - hold_pose：用作 EXECUTING 完成后的 hold loop（详 hold_pose backend
#   doc）。
# - ik：本 smoke 测的真 backend。
#
# **不**复用 configs/scripted_backend_smoke.toml：那里 joints = 1，
# 跟 XLeRobotArmIkSolver.info().joint_count = 5 不匹配，
# IkBackend::start 会返 HardwareMismatch（详 ik.rs (6) 检查）。

[robot]
id             = "ik_backend_smoke"
config_version = "0.3.0"

[[hardware]]
id      = "ik_arm"
adapter = "mock_hard_rt"
# 5-DOF：跟 `XLeRobotArmIkSolver::new(Side::Right).info().joint_names`
# 完全一致（顺序锁定，详 crates/robot-kinematics-xlerobot/src/lib.rs
# `KinematicInfo.joint_names`）。
joints  = ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll"]
motor_ids = [1, 2, 3, 4, 5]

[s1.profile]
backends     = ["mock_dwell", "hold_pose", "ik"]
command_mode = "joint_position"
