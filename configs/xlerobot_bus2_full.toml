# XLeRobot右总线：六臂位置＋三轮原始速度，共用一个S0/串口/停止域。
# 前/左/右角色由下方joints与motor_ids逐槽配对；不得从数组下标猜轮位。
# 维护入口与默认S0的实机验收分别记录，当前不得自动启用。

[robot]
id             = "xlerobot_bus2_full"
config_version = "0.2.0-s0-mixed-raw"

[[hardware]]
id          = "right_arm_full_with_base"
adapter     = "feetech_sts3215"
auto_enable = false
# 仅已测FW3.10/Phase12的raw 0/+500；连接只读核对，不改电机参数。
feetech_bus2_mixed_raw = true
address     = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C122340-if00"
joints      = [
    "right_arm_shoulder_pan",
    "right_arm_shoulder_lift",
    "right_arm_elbow_flex",
    "right_arm_wrist_flex",
    "right_arm_wrist_roll",
    "right_arm_gripper",
    "base_right_wheel",
    "base_front_wheel",
    "base_left_wheel",
]
# joints 与 motor_ids 逐槽配对，是当前轮角色到物理ID的唯一配置来源。
# 换轮位只调整此处配对；轮校准在既有四种轮键中按ID取完整记录。
motor_ids   = [1, 2, 3, 4, 5, 6, 7, 8, 9]
# 校准上下边界容差（raw），与 joints/motor_ids 同序；不改变到位精度。
calibration_range_tolerances_raw = [20, 20, 20, 20, 20, 20, 0, 0, 0]
calibration_paths = [
    "/home/loosqk/repo/dimensional-applications/calibration/right_arm.json",
    "/home/loosqk/repo/dimensional-applications/calibration/base_left9_right7.json",
]
