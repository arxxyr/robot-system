# XLeRobot bus2 右臂完整 6-motor 真机闭环验证配置（task #15 Stage 1）。
#
# 历史路径（任务 28 / 29）：
#   - task 28：bus2 单 joint（右臂 shoulder_pan，ID=1）真机 bring-up
#   - task 29：bus2 单 joint（右臂 gripper，ID=6）+ 标定 JSON 接入 + 双夹爪
#     ±17° 同步演示
#
# task #15 Stage 1（本 config）：右臂**整臂** 6 个 motor 全部驱动，让 SerialRT
# 路径在多关节场景下完整闭环 —— 不仅是 spawn / connect 通过，还要：
#   - sync_read 6 个 motor Present_Position 一次（一帧 sync_read）
#   - sync_write 6 个 motor Goal_Position 一次（一帧 sync_write）
#   - mock_s1 推 6 通道正弦，肉眼看右臂"ballet"
#   - EStop 端到端：1 帧 broadcast Torque_Enable=0 即 hardware 断扭
#   - ClearEStop 后 enable 重新 broadcast Torque_Enable=1，正弦继续
#
# task #15 Stage 2（之后做）：扩到 bus2 全 9 motor（加 base 3 wheel，
# motor_ids = [1..=6, 7, 8, 9]），但 mock_s1 当前没有"部分关节冻结"模式，
# 需要先扩 mock_s1 或者改用 robotctl 手发命令。
#
# ## bus2 拓扑（dimos `04_踩坑记录.md`）
#
# ```
# /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C122340-if00 → 右臂 + 底盘
# calibration 合并 right_arm.json (ID 1-6) + base.json (ID 7-9)
# ```
#
# 本 config 只用 ID 1-6（右臂）；calibration_paths 仍给齐两份（factory
# `load_and_merge` 后按 joint_names 拣对应 6 条，冗余 base 条目无副作用）。
#
# ## right_arm.json 各 motor range（dimos）
#
# 单位 raw（4096 = 360°）。`±5°` ≈ ±57 raw，远在所有 motor range 内。
#
# | joint | id | range_raw     | rad_range          |
# |---|---|---|---|
# | shoulder_pan   | 1 | [1024, 3072] | [-π/2, +π/2]     |
# | shoulder_lift  | 2 | 同上          | 同上              |
# | elbow_flex     | 3 | 同上          | 同上              |
# | wrist_flex     | 4 | 同上          | 同上              |
# | wrist_roll     | 5 | 同上          | 同上              |
# | gripper        | 6 | [1384, 2847] | [-1.02, +1.23] rad |
#
# 真实 range 见 dimos JSON；上表是工程估算。**±0.087 rad (5°)** 远在所有
# range 内，silent clamp 不会触发。
#
# ## 启动期防飞
#
# `FeetechAdapter::enable(true)` 已经在 task 29 落地 follow-current 序列
# （sync_read Present_Position → sync_write Goal_Position 让 target 追平
# current，扭接上瞬间不飞）。`mock_s1 --anchor-timeout-ms 1000` 会订
# S0 state，第一帧 Goal=current 而不是 0；正弦从 current ± amplitude 摆，
# **绝不会**让 motor 从闭合位跳到 center。

[robot]
id             = "xlerobot_bus2_right_arm"
config_version = "0.2.0-task30-bus2"

[[hardware]]
id          = "right_arm_full"
adapter     = "feetech_sts3215"
address     = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C122340-if00"
joints      = [
    "right_arm_shoulder_pan",
    "right_arm_shoulder_lift",
    "right_arm_elbow_flex",
    "right_arm_wrist_flex",
    "right_arm_wrist_roll",
    "right_arm_gripper",
]
motor_ids   = [1, 2, 3, 4, 5, 6]
# 校准上下边界容差（raw），与 joints/motor_ids 同序；不改变到位精度。
calibration_range_tolerances_raw = [20, 20, 20, 20, 20, 20]
calibration_paths = [
    "/home/loosqk/repo/dimensional-applications/calibration/right_arm.json",
    "/home/loosqk/repo/dimensional-applications/calibration/base.json",
]
