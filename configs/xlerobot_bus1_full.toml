# XLeRobot 左总线：左臂 ID1..6、头部 ID7/8，沿既有唯一串口所有者。
# 头部及左腕彩色流由本实例的 SoftRT 采集；相机不会进入执行器线程。
# 校准仍取原 JSON；启用与真实动作需独立现场验收。

[robot]
id             = "xlerobot_bus1_full"
config_version = "0.2.0-s0-head-camera"

[[hardware]]
id          = "left_arm_full_with_head"
adapter     = "feetech_sts3215"
auto_enable = false
address     = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C121427-if00"
joints      = [
    "left_arm_shoulder_pan",
    "left_arm_shoulder_lift",
    "left_arm_elbow_flex",
    "left_arm_wrist_flex",
    "left_arm_wrist_roll",
    "left_arm_gripper",
    "head_motor_1",
    "head_motor_2",
]
motor_ids   = [1, 2, 3, 4, 5, 6, 7, 8]
# 校准上下边界容差（raw），与 joints/motor_ids 同序；不改变到位精度。
calibration_range_tolerances_raw = [20, 20, 20, 20, 20, 20, 20, 20]
calibration_paths = [
    "/home/loosqk/repo/dimensional-applications/calibration/left_arm.json",
    "/home/loosqk/repo/dimensional-applications/calibration/head.json",
]

# 已在 Orin 核对 D435i（序列号 043323051347）的 RGB 接口；不用易变的 video8。
# helper 路径跟随正式仓库；候选验证使用隔离工作目录，不启动正式电机实例。
[[sensor]]
hardware_id = "left_arm_full_with_head"
id = "head_color"
adapter = "opencv_v4l2"
device = "/dev/v4l/by-path/platform-3610000.usb-usb-0:2:1.3-video-index0"
python = "/home/loosqk/repo/dimensional-applications/.venv/bin/python"
helper = "/home/loosqk/repo/robot/robot-system/scripts/camera_capture.py"
width = 640
height = 480
fps = 15

# 现场画面已确认：机器人自身左腕接 USB 端口 2.2。
[[sensor]]
hardware_id = "left_arm_full_with_head"
id = "left_wrist_color"
adapter = "opencv_v4l2"
device = "/dev/v4l/by-path/platform-3610000.usb-usb-0:2.2:1.0-video-index0"
python = "/home/loosqk/repo/dimensional-applications/.venv/bin/python"
helper = "/home/loosqk/repo/robot/robot-system/scripts/camera_capture.py"
width = 640
height = 480
fps = 5
