# scripted_backend_smoke dev box 默认配置（v0.4 候选 1 (3/3)）。
#
# 用途：`crates/robot-tests/src/bin/scripted_backend_smoke.rs` 起 daemon
# 时 `--config configs/scripted_backend_smoke.toml` 喂入。
#
# 跟 `configs/crash_restart_smoke.toml` 同款 dev box mock_hard_rt + 单
# joint 骨架，但**多一个** `[s1.profile]` 段把 scripted backend 加进
# profile.backends，让 `BackendRegistry::dispatch` 能匹配
# `(ActionKind::Scripted, SCHEMA_SCRIPTED_PAYLOAD)`（详
# `crates/robot-s1/src/action_backend/mod.rs::BackendRegistry::dispatch`）。
#
# `mock_dwell` / `hold_pose` 也保留：
# - mock_dwell：兼容 selftest / GetTaskStatus 探活路径（DwellMs kind
#   现在不被本 smoke 触发，但保留避免 startup `validate_profile_section`
#   抱怨 enabled 列表缺失）。
# - hold_pose：用作 EXECUTING 完成后的 hold loop（详 hold_pose backend
#   doc）。
# - scripted：本 smoke 测的真 backend。
#
# **不**复用 configs/crash_restart_smoke.toml：那个无 [s1.profile]，走
# `ProfileSection::default_b2()` = ["mock_dwell"] only → InvokeTask kind
# = Scripted 会 NoBackendForKind → Unimplemented。

[robot]
id             = "scripted_backend_smoke"
config_version = "0.3.0"

[[hardware]]
id      = "smoke_arm"
adapter = "mock_hard_rt"
joints  = ["smoke_j0"]
motor_ids = [1]

[s1.profile]
backends     = ["mock_dwell", "hold_pose", "scripted"]
command_mode = "joint_position"
