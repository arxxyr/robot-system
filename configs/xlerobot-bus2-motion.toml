# 右臂六关节的运动约束片段，供现有维护入口及常驻S1合成候选配置。
# 不单独作为设备配置安装；不保存动作锚点，不自动使能。
# 三轮为原始速度槽，不列入位置约束；本轮命令保持 raw 0。
# tolerance_rad 按原 raw_to_rad 的 f32 编码差值上界，保证 ±20 raw 接受、±21 raw 拒绝。
# 运动范围沿原校准，不叠加校准边界容差。
[s1.single_joint]
max_duration_ms = 20000
settle_timeout_ms = 800
stable_window_ms = 200

# ID1，原校准 raw [839, 3511]；±20 raw 到位容差。
[[s1.single_joint.joints]]
name = "right_arm_shoulder_pan"
min_position_rad = -1.8530488014221191
max_position_rad = 2.2457480430603027
max_velocity_rad_s = 0.10
tolerance_rad = 0.030679702758789063

