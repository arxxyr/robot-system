# 左臂和头部的单关节运动约束片段，供现有维护入口或 prepare --left-control 与 bus1 合成 S1 配置。
# 不单独作为设备配置安装；不保存动作锚点，不自动使能。
# 到位容差按每关节配置；本机统一允许 ±20 raw（约 1.76°）。
# tolerance_rad 使用原 raw_to_rad 的 f32 编码差值上界，确保 20 raw 接受、21 raw 拒绝。
# 主动目标范围沿原校准；原位保持另复用 hardware.calibration_range_tolerances_raw，不裁剪当前位置。
[s1.single_joint]
max_duration_ms = 20000
settle_timeout_ms = 800
stable_window_ms = 200

