# crash_restart_smoke dev box 默认配置。
#
# 用途：`crates/robot-tests/src/bin/crash_restart_smoke.rs` 起 daemon 时
# `--config configs/crash-restart-smoke.toml` 喂入。
#
# 设计目标：
# - **dev box 兼容**：单 hardware section + `mock_hard_rt` adapter，**不**依
#   赖 `feature = "real-hw"`（serialport / libudev 系统依赖只在 Orin 真机
#   build；dev box 走 default `xlerobot` feature 不编译 feetech `factory`
#   模块，无 `feetech_sts3215` 注册到 inventory，bus2 真硬件配置在 dev box
#   会立即 fatal）。
# - 单 joint 足够驱动 state machine（state Safe → Ready → Enabled.Active）
#   + EStop fsync 双写测试；joint 数量跟测试结果无关，最小化避免与 mock_s1
#   `--joints` 参数失配。
# - **不**复用 configs/xlerobot.toml：那个含 mock_omni3 base + 多 hardware
#   section + sensor section，给生产仿真用；smoke 不需要那么多骨架。
# - **不**复用 configs/clear-estop-e2e.toml：跟 clear_estop_e2e binary 解
#   耦，避免任一 smoke 改 config 互相牵动。
#
# Orin 真机 bus1 / bus2 仍用 `configs/xlerobot-bus1.toml` /
# `xlerobot-bus2.toml`（feetech_sts3215 + real-hw feature）。dev box
# crash_restart_smoke 不在 Orin 跑 9-motor，跟 §6.7 #4 "S0 重启不失忆"
# 的 fsync 双写语义验证完全等价。

[robot]
id             = "crash_restart_smoke"
config_version = "0.3.0"

[[hardware]]
id      = "smoke_arm"
adapter = "mock_hard_rt"
joints  = ["smoke_j0"]
motor_ids = [1]
