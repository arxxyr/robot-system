# XLeRobot task 29 单关节真机 bring-up 配置（含 dimos 标定接入）。
#
# 基于 task 28 的单关节 config 扩展：
#   - joint 名改为 dimos 标准 `left_arm_shoulder_pan`（与 bus1 ID=1 对齐
#     dimos `calibration/left_arm.json` 第一条记录）
#   - 加 `calibration_paths` 读 Orin 上 dimos-deploy 部署好的标定 JSON
#
# **calibration 语义**：factory 仅 *读* JSON 到内存做 silent clamp +
# limits 推导；**不**写 EEPROM（dimos 侧已经写过，二次覆盖风险 > 便利）。
# 详情 docs/CHANGELOG.md 2026-04-25 "Step 7 task 29"。
#
# **启动时 follow-current 防飞**：adapter `enable(true)` 会先
# `sync_read Present_Position → sync_write Goal_Position`，让 target
# 追平当前位置，Torque 接上瞬间不飞。详 adapter.rs 顶部注释。
#
# bus1 拓扑（dimos `04_踩坑记录.md`）：
#   /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C121427-if00 → left_arm + head
#   calibration 合并 `left_arm.json` (ID 1-6) + `head.json` (ID 7-8)
# 本 config 只用 ID=1，**但 calibration_paths 仍需给齐两份**（load_and_merge
# 合并后按 joint_names 拣对应条目；冗余条目不会导致 adapter 加载错）。

[robot]
id             = "xlerobot_task29"
config_version = "0.2.0-task29"

[[hardware]]
id          = "left_arm_single"
adapter     = "feetech_sts3215"
address     = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C121427-if00"
joints      = ["left_arm_shoulder_pan"]
motor_ids   = [1]
# Orin 上 dimos-deploy 侧已写好的标定；绝对路径，不走 symlink（handoff §4.6）。
calibration_paths = [
    "/home/loosqk/repo/dimensional-applications/calibration/left_arm.json",
    "/home/loosqk/repo/dimensional-applications/calibration/head.json",
]
