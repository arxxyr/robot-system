# 历史试验配置：task29 左夹爪 ID6。
# 仅供查阅，配置值保留；当前入口和归档边界见 ../README.md。

[robot]
id             = "xlerobot_task29"
config_version = "0.2.0-task29"

[[hardware]]
id          = "left_arm_single"
adapter     = "feetech_sts3215"
address     = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C121427-if00"
joints      = ["left_arm_gripper"]
motor_ids   = [6]
# 校准上下边界容差（raw），与 joints/motor_ids 同序；不改变到位精度。
calibration_range_tolerances_raw = [20]
# dimos calibration/left_arm.json 里 left_arm_gripper: range=[1408, 2886] raw，
# 对应 rad ≈ [-0.98, +1.29]（≈ [-56°, +74°]）。±5° 远在 range 内，silent clamp
# 不触发；真机闭环 bring-up 阶段只试小角度开合。
# Orin 上 dimos-deploy 侧已写好的标定；绝对路径，不走 symlink（handoff §4.6）。
calibration_paths = [
    "/home/loosqk/repo/dimensional-applications/calibration/left_arm.json",
    "/home/loosqk/repo/dimensional-applications/calibration/head.json",
]
