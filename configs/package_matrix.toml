# 仅登记当前 XLeRobot Orin S0 的生产组合；不改写配置或安装路径。
[packages.xlerobot-orin-s0]
target = "aarch64-unknown-linux-gnu"
cargo_package = "robot-s0"
default_features = true
features = ["xlerobot-real"]
bins = ["s0_daemon", "xlerobot_deploy"]
files = [
    { source = "configs/xlerobot_bus1_full.toml", destination = "configs/xlerobot_bus1_full.toml" },
    { source = "configs/xlerobot_bus2_full.toml", destination = "configs/xlerobot_bus2_full.toml" },
    { source = "scripts/systemd/xlerobot-handoff.service", destination = "systemd/xlerobot-handoff.service" },
    { source = "scripts/systemd/xlerobot-s0-bus1.service", destination = "systemd/xlerobot-s0-bus1.service" },
    { source = "scripts/systemd/xlerobot-s0-bus2.service", destination = "systemd/xlerobot-s0-bus2.service" },
    { source = "scripts/camera_capture.py", destination = "scripts/camera_capture.py" },
]
