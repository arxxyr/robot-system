# XLeRobot task 28 单关节真机 bring-up 配置。
#
# 用 dimos bus1 (左臂总线) 的 ID=1 motor（按 dimos 04_踩坑记录 是
# 左臂 shoulder_pan）做最小验证：ping → read Present_Position → 写 Goal_Position。
#
# **address by-id**：udev 稳定路径，reboot / 拔插顺序变化也不漂移。
# Orin 上当前两根 USB-RS485：
#   /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C121427-if00 → ttyACM*  (一根)
#   /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C122340-if00 → ttyACM*  (另一根)
# 哪个对应 bus1（左臂）需要 task 28 ping 测试时实测确定，本文件先写其中一个，
# 错了的话用 cargo run --features xlerobot-real -- --config ... 启动会 ping 失败，
# 切到另一个再试。

[robot]
id             = "xlerobot_task28"
config_version = "0.2.0-task28"

[[hardware]]
id          = "test_motor"
adapter     = "feetech_sts3215"
address     = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C121427-if00"
joints      = ["test_j1"]
motor_ids   = [1]
