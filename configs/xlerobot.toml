# XLeRobot 模拟配置；真实总线接线见 xlerobot-bus1.toml / xlerobot-bus2.toml。
#
# `docs/00_design.md` §7.2 / §7.3 schema：
#   [robot]            必填，给 ConfigIdentity 用
#   [[hardware]]       本示例仅使用 mock
#   [[sensor]]         可选，显式声明归属硬件实例的 opencv_v4l2 BGR8 相机
#
# 供 robot-s0 `--config configs/xlerobot.toml` 替代纯 CLI 模式。

[robot]
id             = "xlerobot"
config_version = "0.2.0"

# ---- 模拟手臂总线 --------------------------------------------------------
[[hardware]]
id          = "left_arm"
adapter     = "mock_hard_rt"
address     = "/dev/ttyACM0"
joints      = [
    "left_arm_shoulder_pan",
    "left_arm_shoulder_lift",
    "left_arm_elbow",
    "left_arm_wrist",
    "left_arm_gripper",
]
motor_ids   = [1, 2, 3, 4, 5]
calibration = "calibration/left_arm.json"
auto_enable = true

[[hardware]]
id          = "right_arm"
adapter     = "mock_hard_rt"
address     = "/dev/ttyACM1"
joints      = [
    "right_arm_shoulder_pan",
    "right_arm_shoulder_lift",
    "right_arm_elbow",
    "right_arm_wrist",
    "right_arm_gripper",
]
motor_ids   = [1, 2, 3, 4, 5]
calibration = "calibration/right_arm.json"
auto_enable = true

# ---- 模拟三轮全向底盘 ----------------------------------------------------
[[hardware]]
id           = "base"
adapter      = "mock_omni3"
address      = "/dev/ttyACM2"
joints       = ["wheel_1", "wheel_2", "wheel_3"]
motor_ids    = [7, 8, 9]
wheel_radius = 0.05
base_radius  = 0.125

# 本模拟配置不声明相机设备。已核实的头部 RGB 配置见 xlerobot-bus1.toml；
# 腕部设备须核对稳定路径和实际格式后再填写，不使用未实现的深度或 IMU 字段。
