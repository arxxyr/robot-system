# XLeRobot task 29 右臂夹爪真机 bring-up 配置。
#
# 与 xlerobot_task29_single_joint.toml（左臂夹爪）对称：
#   - address 切换到 bus2 `5A7C122340`（右臂 + 底盘总线）
#   - joint = `right_arm_gripper`（dimos `calibration/right_arm.json` ID=6）
#   - robot_id = `xlerobot_task29_right`，与左臂 `xlerobot_task29` 在
#     iceoryx2 topic 空间上完全独立
#   - calibration_paths 合并 right_arm.json (ID 1-6) + base.json (ID 7-9)
#
# 用途：双夹爪"同步开合"演示 —— 两条 bus 各起一个 s0_daemon + mock_s1，
# 几乎同时 spawn → 相位差 < 100 ms，肉眼看起来像"同步芭蕾"。
#
# dimos right_arm.json `right_arm_gripper`：range=[1384, 2847] raw，对应
# rad ≈ [-1.02, +1.23]（≈ [-58°, +70°]）。±5° 远在 range 内，silent clamp
# 不触发。

[robot]
id             = "xlerobot_task29_right"
config_version = "0.2.0-task29"

[[hardware]]
id          = "right_arm_single"
adapter     = "feetech_sts3215"
address     = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7C122340-if00"
joints      = ["right_arm_gripper"]
motor_ids   = [6]
# 校准上下边界容差（raw），与 joints/motor_ids 同序；不改变到位精度。
calibration_range_tolerances_raw = [20]
calibration_paths = [
    "/home/loosqk/repo/dimensional-applications/calibration/right_arm.json",
    "/home/loosqk/repo/dimensional-applications/calibration/base.json",
]
